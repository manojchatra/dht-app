<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acknowledgement — Desert Hot Tubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/util.js"></script>
<style>
.hamburger{display:none!important}
@media(max-width:768px){.hamburger{display:flex!important}}
.ack-tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:24px}
.ack-tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border:none;background:none;font-family:var(--font);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;display:flex;align-items:center;gap:6px}
.ack-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ack-table{width:100%;border-collapse:collapse;font-size:13px}
.ack-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);background:var(--surface2)}
.ack-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.ack-table tr:hover td{background:var(--surface2)}
.btn-plus{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.btn-plus:hover{opacity:.85}
.btn-eye{width:32px;height:32px;border-radius:6px;background:var(--surface2);color:var(--accent);border:1px solid var(--border);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn-eye:hover{background:var(--accent-bg)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{font-size:13px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--font)}
.search-bar input{flex:1;min-width:180px}
.search-bar #searchName{flex:1 1 260px}
.date-input-wrap{position:relative;flex:0 1 150px;min-width:130px}
.date-filter-lbl{font-size:12px;color:var(--text-muted);font-weight:500;white-space:nowrap}
.date-filter-dash{color:var(--text-muted)}
.tab-count{font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;background:var(--surface2);color:var(--text-muted)}
.tab-count:empty{display:none}
.tab-count.hit{background:var(--accent-bg);color:var(--accent)}
.search-elsewhere{margin-top:10px;font-size:13px}
.search-elsewhere button{background:none;border:none;color:var(--accent);cursor:pointer;font-family:var(--font);font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:0 4px}
.date-input-wrap input[type=text]{width:100%;min-width:0;padding-right:32px}
.date-input-wrap input[type=text].input-error{border-color:var(--red)}
.date-pick-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;font-size:13px;line-height:1}
.date-pick-btn:hover{color:var(--accent)}
.date-native-hidden{position:absolute;inset:0;opacity:0;pointer-events:none;width:1px;height:1px}
.slot-pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;white-space:nowrap}
.awaiting-pill{display:inline-flex;align-items:center;gap:5px;background:var(--yellow-bg);color:var(--yellow);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;white-space:nowrap}
.gen-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.modal-list-row{padding:12px 14px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);margin-bottom:8px;transition:all .15s}
.modal-list-row:hover{background:var(--accent-bg);border-color:var(--accent)}
.ack-cards{display:none}
.ack-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.ack-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ack-card-name{font-weight:600;font-size:14px}
.ack-card-store{font-size:11px;color:var(--text-muted);margin-top:2px}
.ack-card-meta{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.ack-card-address{font-size:12px;color:var(--text-muted);margin-bottom:8px}
@media(max-width:768px){
  .ack-table{display:none !important}
  .ack-cards{display:block !important}
}
</style>
</head>
<body>
<div id="sidebar-root"></div>
<script src="/js/sidebar.js"></script>
<main class="main">
  <div class="top-bar">
    <h1 style="margin:0">Acknowledgement</h1>
    <button class="gen-btn" onclick="openGenModal()">
      <i class="fa-solid fa-clipboard-list"></i> Generate Acknowledgement Form
    </button>
  </div>

  <div class="ack-tab-bar">
    <button class="ack-tab active" data-tab="scheduled" onclick="switchAckTab('scheduled')">
      <i class="fa-solid fa-calendar-check"></i> Scheduled <span class="tab-count"></span>
    </button>
    <button class="ack-tab" data-tab="completed" onclick="switchAckTab('completed')">
      <i class="fa-solid fa-circle-check"></i> Completed <span class="tab-count"></span>
    </button>
  </div>

  <!-- One filter bar for both tabs (stays set when switching); the date follows the tab -->
  <div class="search-bar">
    <input type="text" id="searchName" placeholder="Search name, contract #, serial, address…" autocomplete="off" oninput="renderAll()">
    <span class="date-filter-lbl" id="dateFilterLbl">Delivery date</span>
    <div class="date-input-wrap">
      <input type="text" id="fromDateText" placeholder="From" maxlength="10" autocomplete="off" oninput="maskUSDateInput(this)"
             onblur="syncDateFromText('fromDateText','fromDate');renderAll()" onkeydown="if(event.key==='Enter')this.blur()">
      <input type="date" id="fromDate" class="date-native-hidden" tabindex="-1" onchange="syncTextFromDate('fromDate','fromDateText');renderAll()">
      <button type="button" class="date-pick-btn" tabindex="-1" onclick="openDatePicker('fromDate')" title="Pick the From date"><i class="fa-solid fa-calendar"></i></button>
    </div>
    <span class="date-filter-dash">–</span>
    <div class="date-input-wrap">
      <input type="text" id="toDateText" placeholder="To" maxlength="10" autocomplete="off" oninput="maskUSDateInput(this)"
             onblur="syncDateFromText('toDateText','toDate');renderAll()" onkeydown="if(event.key==='Enter')this.blur()">
      <input type="date" id="toDate" class="date-native-hidden" tabindex="-1" onchange="syncTextFromDate('toDate','toDateText');renderAll()">
      <button type="button" class="date-pick-btn" tabindex="-1" onclick="openDatePicker('toDate')" title="Pick the To date"><i class="fa-solid fa-calendar"></i></button>
    </div>
    <button type="button" class="btn btn-secondary btn-sm" id="clearFiltersBtn" onclick="clearFilters()" style="display:none"><i class="fa-solid fa-filter-circle-xmark"></i> Clear filters</button>
  </div>

  <div id="tab-scheduled">
    <div id="schedContent"><div style="text-align:center;padding:40px;color:var(--text-muted)"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div></div>
  </div>

  <div id="tab-completed" style="display:none">
    <div id="compContent"></div>
  </div>
</main>

<!-- Generate Ack Modal -->
<div class="modal-overlay" id="genModal">
  <div class="modal-box" style="max-width:520px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:15px;font-weight:600"><i class="fa-solid fa-clipboard-list" style="color:var(--accent)"></i> Select Scheduled Contract</h2>
      <button onclick="closeGenModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted)">×</button>
    </div>
    <div id="genModalList" style="max-height:380px;overflow-y:auto"></div>
  </div>
</div>

<script>

// Toast
function showToast(msg,type='success'){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);
}

// ── US date (M-DD-YYYY) text field <-> hidden ISO date input ─────────────────
function fmtUSDate(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  if(p.length!==3) return '';
  return parseInt(p[1],10)+'-'+p[2]+'-'+p[0];
}
function parseUSDate(str){
  str=(str||'').trim();
  if(!str) return null;
  const m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(!m) return null;
  const mo=parseInt(m[1],10),da=parseInt(m[2],10),yr=parseInt(m[3],10);
  if(mo<1||mo>12||da<1||da>31) return null;
  const pad=n=>String(n).padStart(2,'0');
  return {iso:yr+'-'+pad(mo)+'-'+pad(da), us:mo+'-'+pad(da)+'-'+yr};
}
function maskUSDateInput(el){
  el.value=el.value.replace(/[^\d\-]/g,'');
}
function syncDateFromText(textId,hiddenId){
  const t=document.getElementById(textId),h=document.getElementById(hiddenId);
  if(!t.value.trim()){h.value='';t.classList.remove('input-error');return}
  const parsed=parseUSDate(t.value);
  if(parsed){h.value=parsed.iso;t.value=parsed.us;t.classList.remove('input-error')}
  else{h.value='';t.classList.add('input-error');showToast('Enter date as M-DD-YYYY','error')}
}
function syncTextFromDate(hiddenId,textId){
  const h=document.getElementById(hiddenId),t=document.getElementById(textId);
  t.value=fmtUSDate(h.value);
  t.classList.remove('input-error');
}
function openDatePicker(hiddenId){
  const h=document.getElementById(hiddenId);
  if(h.showPicker){try{h.showPicker()}catch(e){h.focus()}}else{h.focus();h.click()}
}

// Close action dropdowns on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.action-menu')){
    document.querySelectorAll('.action-dropdown.open').forEach(d=>d.classList.remove('open'));
  }
});

function toggleActionMenu(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  document.querySelectorAll('.action-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  dd.classList.toggle('open');
}

</script>
<script>function goToDelivery(id) { window.location.href = '/delivery/' + id; }


let allContracts = [];

function fmtSlot(dt, dur) {
  if (!dt) return '—';
  const d = new Date(dt + '-07:00');
  const tz = 'America/Phoenix';
  const end = new Date(d.getTime() + (parseInt(dur)||120)*60000);
  return d.toLocaleDateString('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'})
    + ' · ' + d.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit'})
    + ' – ' + end.toLocaleTimeString('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit'});
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

async function init() {
  // Delivery gets a team-scoped, pricing-stripped feed instead of the full
  // /api/contracts list admin uses — same rule as GET /api/delivery/contract/:id.
  const isDelivery = window._userRole === 'delivery';
  allContracts = await fetch(isDelivery ? '/api/delivery/acknowledgements' : '/api/contracts').then(r=>r.json()).catch(()=>[]);
  renderAll();
}

let currentAckTab = 'scheduled';
function switchAckTab(tab) {
  currentAckTab = tab;
  document.querySelectorAll('.ack-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.getElementById('tab-scheduled').style.display = tab==='scheduled'?'':'none';
  document.getElementById('tab-completed').style.display  = tab==='completed'?'':'none';
  renderAll();
}

// ── Filters (both tabs, any role — delivery users get only their team's list) ──
// Search: name, contract #, serial, address, store. Dates: From / To, each
// optional and inclusive; the date follows the tab — the delivery slot's date
// on Scheduled, the delivered date on Completed.
const ACK_TABS = {
  scheduled: { label:'Scheduled', dateLabel:'Delivery date', is:c=>c.status==='scheduled', date:c=>(c.scheduled_datetime||'').slice(0,10) },
  completed: { label:'Completed', dateLabel:'Delivered date', is:c=>c.status==='delivered'&&!!c.acknowledgement_pdf_url, date:c=>c.delivery_date||'' },
};
function ackFilters(){
  return { q:(document.getElementById('searchName').value||'').trim().toLowerCase(),
           from:document.getElementById('fromDate').value, to:document.getElementById('toDate').value };
}
const filtersActive = f => !!(f.q||f.from||f.to);
function ackMatches(c, tab, f){
  if (f.q && ![c.customer_name,c.contract_number,c.serial_number,c.address,c.store].join(' ').toLowerCase().includes(f.q)) return false;
  if (f.from||f.to) {
    const d = ACK_TABS[tab].date(c);
    if (!d || (f.from && d<f.from) || (f.to && d>f.to)) return false;
  }
  return true;
}
function ackRows(tab, f){ return allContracts.filter(c=>ACK_TABS[tab].is(c)&&ackMatches(c,tab,f)); }
// Empty-tab message: "No matches" plus links to the other tab when it has some.
function noMatchHtml(tab, f, emptyIcon, emptyText){
  if (!filtersActive(f)) return '<div style="text-align:center;padding:48px;color:var(--text-muted)"><i class="fa-solid '+emptyIcon+' fa-2x" style="display:block;margin-bottom:12px"></i>'+emptyText+'</div>';
  const others = Object.keys(ACK_TABS).filter(t=>t!==tab).map(t=>[t,ackRows(t,f).length]).filter(x=>x[1]);
  return '<div style="text-align:center;padding:48px;color:var(--text-muted)"><i class="fa-solid fa-magnifying-glass fa-2x" style="display:block;margin-bottom:12px"></i>No matches in '+ACK_TABS[tab].label
    +(others.length?'<div class="search-elsewhere">Found in'+others.map(x=>'<button type="button" onclick="switchAckTab(\''+x[0]+'\')">'+ACK_TABS[x[0]].label+' ('+x[1]+')</button>').join(',')+'</div>':'')+'</div>';
}
function renderAll(){
  const f = ackFilters(), active = filtersActive(f);
  document.getElementById('dateFilterLbl').textContent = ACK_TABS[currentAckTab].dateLabel;
  document.getElementById('clearFiltersBtn').style.display = active ? '' : 'none';
  document.querySelectorAll('.ack-tab').forEach(t=>{
    const badge = t.querySelector('.tab-count'), n = active ? ackRows(t.dataset.tab,f).length : 0;
    badge.textContent = active ? String(n) : '';
    badge.classList.toggle('hit', active && n>0);
  });
  renderScheduled();
  renderCompleted();
}

// Only admin/delivery can actually complete an acknowledgement (backend:
// GET /api/delivery/contract/:id is gated to those two roles) — sales sees
// this list too (scoped to their own contracts), but the action itself
// would dead-end for them, so show a status pill instead of a live button.
function ackActionHtml(c) {
  const canStart = window._userRole === 'admin' || window._userRole === 'delivery';
  if (canStart) return '<button class="btn-plus" title="Start Acknowledgement" onclick="goToDelivery('+c.id+')"><i class="fa-solid fa-plus"></i></button>';
  return '<span class="awaiting-pill"><i class="fa-solid fa-hourglass-half"></i> Awaiting Acknowledgement</span>';
}

function renderScheduled() {
  const f = ackFilters();
  const rows = ackRows('scheduled', f);
  const el = document.getElementById('schedContent');
  if (!rows.length) {
    el.innerHTML = noMatchHtml('scheduled', f, 'fa-calendar-xmark', 'No scheduled contracts');
    return;
  }
  const tableHtml = '<div style="overflow-x:auto"><table class="ack-table">'
    +'<thead><tr><th>Customer</th><th>Contract #</th><th>Serial No.</th><th>Address</th><th>Delivery Slot</th><th style="text-align:center">Ack</th></tr></thead>'
    +'<tbody>'
    + rows.map(c=>'<tr>'
      +'<td><div style="font-weight:600">'+escHtml(c.customer_name||'—')+'</div><div style="font-size:11px;color:var(--text-muted)">'+escHtml(c.store||'')+'</div></td>'
      +'<td><span style="font-family:monospace;font-size:12px">'+escHtml(c.contract_number||'—')+'</span></td>'
      +'<td style="font-size:12px;color:var(--text-muted)">'+escHtml(c.serial_number||'—')+'</td>'
      +'<td style="font-size:12px;max-width:160px"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(c.address||'—')+'</div></td>'
      +'<td><span class="slot-pill"><i class="fa-solid fa-clock"></i>'+fmtSlot(c.scheduled_datetime,c.scheduled_duration)+'</span></td>'
      +'<td style="text-align:center">'+ackActionHtml(c)+'</td>'
      +'</tr>'
    ).join('')
    +'</tbody></table></div>';
  const cardsHtml = '<div class="ack-cards">'
    + rows.map(c=>'<div class="ack-card">'
      +'<div class="ack-card-top">'
        +'<div><div class="ack-card-name">'+escHtml(c.customer_name||'—')+'</div><div class="ack-card-store">'+escHtml(c.store||'')+'</div></div>'
        +ackActionHtml(c)
      +'</div>'
      +'<div class="ack-card-meta">'+escHtml(c.contract_number||'—')+(c.serial_number?' · S/N: '+escHtml(c.serial_number):'')+'</div>'
      +'<div class="ack-card-address">'+escHtml(c.address||'—')+'</div>'
      +'<span class="slot-pill"><i class="fa-solid fa-clock"></i>'+fmtSlot(c.scheduled_datetime,c.scheduled_duration)+'</span>'
      +'</div>'
    ).join('')
    +'</div>';
  el.innerHTML = tableHtml + cardsHtml;
}

function renderCompleted() {
  var f = ackFilters();
  var rows = ackRows('completed', f);
  var el = document.getElementById('compContent');
  if (!rows.length) {
    el.innerHTML = noMatchHtml('completed', f, 'fa-inbox', 'No completed acknowledgements');
    return;
  }
  const tableHtml = '<div style="overflow-x:auto"><table class="ack-table">'
    +'<thead><tr><th>Customer</th><th>Contract #</th><th>Serial No.</th><th>Delivery Date</th><th style="text-align:center">PDF</th></tr></thead>'
    +'<tbody>'
    + rows.map(function(c){ return '<tr>'
      +'<td><div style="font-weight:600">'+escHtml(c.customer_name||'—')+'</div><div style="font-size:11px;color:var(--text-muted)">'+escHtml(c.store||'')+'</div></td>'
      +'<td><span style="font-family:monospace;font-size:12px">'+escHtml(c.contract_number||'—')+'</span></td>'
      +'<td style="font-size:12px;color:var(--text-muted)">'+escHtml(c.serial_number||'—')+'</td>'
      +'<td>'+fmtDate(c.delivery_date)+'</td>'
      +'<td style="text-align:center"><a class="btn-eye" href="'+c.acknowledgement_pdf_url+'" target="_blank" title="View PDF"><i class="fa-solid fa-eye"></i></a></td>'
      +'</tr>';
  }).join('')
    +'</tbody></table></div>';
  const cardsHtml = '<div class="ack-cards">'
    + rows.map(function(c){ return '<div class="ack-card">'
      +'<div class="ack-card-top">'
        +'<div><div class="ack-card-name">'+escHtml(c.customer_name||'—')+'</div><div class="ack-card-store">'+escHtml(c.store||'')+'</div></div>'
        +'<a class="btn-eye" href="'+c.acknowledgement_pdf_url+'" target="_blank" title="View PDF"><i class="fa-solid fa-eye"></i></a>'
      +'</div>'
      +'<div class="ack-card-meta">'+escHtml(c.contract_number||'—')+(c.serial_number?' · S/N: '+escHtml(c.serial_number):'')+'</div>'
      +'<div class="ack-card-meta">Delivered: '+fmtDate(c.delivery_date)+'</div>'
      +'</div>';
  }).join('')
    +'</div>';
  el.innerHTML = tableHtml + cardsHtml;
}

// Search and both dates emptied in one go.
function clearFilters() {
  ['searchName','fromDate','fromDateText','toDate','toDateText'].forEach(function(id){
    var el=document.getElementById(id); el.value=''; el.classList.remove('input-error');
  });
  renderAll();
}

function openGenModal() {
  var rows = allContracts.filter(function(c){return c.status==='scheduled';});
  var list = document.getElementById('genModalList');
  if (!rows.length) {
    list.innerHTML='<div style="text-align:center;padding:24px;color:var(--text-muted)">No scheduled contracts</div>';
  } else {
    var mhtml='';
    rows.forEach(function(c){
      mhtml += '<div class="modal-list-row" onclick="goToDelivery('+c.id+')">'
        +'<div>'
          +'<div style="font-weight:600;font-size:14px">'+escHtml(c.customer_name||'—')+'</div>'
          +'<div style="font-size:12px;color:var(--text-muted);margin-top:2px">'+escHtml(c.contract_number||'')+(c.serial_number?' · S/N: '+escHtml(c.serial_number):'')+'</div>'
        +'</div>'
        +'<div style="font-size:11px;color:var(--accent);font-weight:500;text-align:right;margin-left:12px">'+fmtSlot(c.scheduled_datetime,c.scheduled_duration)+'</div>'
        +'</div>';
    });
    list.innerHTML=mhtml;
  }
  document.getElementById('genModal').classList.add('open');
}
function closeGenModal() { document.getElementById('genModal').classList.remove('open'); }
document.getElementById('genModal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeGenModal();});

// Deferred until sidebar.js's auth check sets window._userRole, so the
// delivery-vs-admin branch above is never computed before it's known
// (same convention as view-contracts.html / status.html / dashboard.html).
window._onAuthReady = init;
</script>
</body>
</html>
