<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Contract — Desert Hot Tubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/util.js"></script>
<style>
.preview-wrap{max-width:760px;margin:0 auto}
.preview-header{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.preview-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.preview-section h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pkv label{font-size:11px;color:var(--text-muted);display:block}
.pkv span{font-size:13px;font-weight:500;color:var(--text)}
.pcb-yes{color:var(--green);font-weight:600;font-size:13px}
.pcb-no{color:var(--text-light);font-size:13px}
.preview-table{width:100%;border-collapse:collapse;font-size:13px}
.preview-table th{text-align:left;padding:7px 8px;font-size:11px;color:var(--text-muted);font-weight:600;border-bottom:2px solid var(--border)}
.preview-table td{padding:8px;border-bottom:1px solid var(--border)}
.preview-table .price{text-align:right;font-weight:500}
.preview-table .incl{text-align:center;color:var(--green);font-weight:700}
.totals-box{background:var(--green-bg);border:1px solid var(--green-light);border-radius:8px;padding:14px 18px;margin-top:12px}
.totals-box .grand{font-size:20px;font-weight:700;color:var(--green)}
.pending-box{background:var(--red-bg);border:1px solid var(--red-light);border-radius:8px;padding:10px 14px;margin-top:8px;color:var(--red);font-weight:600}
.store-hl{display:inline-block;background:#fef9c3;border:1px solid #fde047;border-radius:6px;padding:4px 12px;font-weight:600;color:#854d0e;font-size:13px;margin-bottom:10px}
.action-row{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:16px 0;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.saving-spinner{display:none;align-items:center;gap:8px;color:var(--text-muted);font-size:14px}
</style>
</head>
<body>
<button class="hamburger" onclick="openMobileSidebar()"><i class="fa-solid fa-bars"></i> Menu</button>
<a class="mobile-home-btn" href="/dashboard" aria-label="Home"><i class="fa-solid fa-house"></i></a>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/dashboard" class="brand-mark"><span class="brand-glyph">DHT</span><span class="brand-text"><span class="brand-name">Desert Hot Tubs</span><span class="brand-sub">Sales &amp; Delivery</span></span></a>
  </div>
  <div>
    <button class="nav-item " id="nav-contracts"
            onclick="toggleNav('contracts')">
      <i class="fa-solid fa-file-contract"></i>Contracts
      <i class="fa-solid fa-chevron-right nav-arrow"></i>
    </button>
    <div class="nav-sub " id="sub-contracts">
      <a class="nav-sub-item "   href="/contracts/new"><i class="fa-solid fa-plus"></i> New Contract</a>
      <a class="nav-sub-item " href="/contracts"><i class="fa-solid fa-list"></i> View Contracts</a>
    </div>
  </div>
  <div>
    <button class="nav-item " id="nav-status"
            onclick="toggleNav('status')">
      <i class="fa-solid fa-chart-gantt"></i>Status
      <i class="fa-solid fa-chevron-right nav-arrow"></i>
    </button>
    <div class="nav-sub " id="sub-status">
      <a class="nav-sub-item "  href="/status?tab=assigned"><i class="fa-solid fa-circle-check"></i> Assigned</a>
      <a class="nav-sub-item "       href="/status?tab=tbo"><i class="fa-solid fa-box"></i> To Be Ordered</a>
      <a class="nav-sub-item " href="/status?tab=received"><i class="fa-solid fa-truck-arrow-right"></i> Received</a>
      <a class="nav-sub-item " href="/status?tab=scheduled"><i class="fa-solid fa-calendar-check"></i> Scheduled</a>
      <a class="nav-sub-item " href="/status?tab=delivered"><i class="fa-solid fa-truck-ramp-box"></i> Delivered</a>
      <a class="nav-sub-item " href="/status?tab=cancelled"><i class="fa-solid fa-ban"></i> Cancelled</a>
    </div>
  </div>
  <a class="nav-item" href="/calendar"><i class="fa-solid fa-calendar"></i>Calendar</a>
  <a class="nav-item" href="/acknowledgement"><i class="fa-solid fa-clipboard-check"></i>Acknowledgement</a>
  <a class="nav-item " href="/post-delivery"><i class="fa-solid fa-phone"></i>Post-Delivery Follow-up</a>
  <hr class="nav-divider">
  <div class="sidebar-bottom">
    <a class="nav-item " href="/settings"><i class="fa-solid fa-gear"></i>Settings</a>
    <button class="nav-item" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i>Sign Out</button>
    <div class="user-chip">
      <div class="user-avatar" id="userAvatar">?</div>
      <div><div class="user-name" id="userName">…</div><div class="user-role" id="userRole"></div></div>
    </div>
  </div>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
<main class="main">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <button onclick="continueEditing()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;font-family:inherit">
      <i class="fa-solid fa-arrow-left"></i> Continue Editing
    </button>
  </div>
  <div class="preview-wrap">
    <div class="preview-header">
      <div>
        <div style="font-size:20px;font-weight:700;color:var(--accent)">Contract Preview</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Review all details before saving</div>
      </div>
      <div class="saving-spinner" id="savingSpinner"><i class="fa-solid fa-spinner fa-spin"></i> Saving...</div>
    </div>
    <div id="previewBody">
      <div style="text-align:center;padding:40px;color:var(--text-muted)"><i class="fa-solid fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:10px"></i>Loading preview...</div>
    </div>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="continueEditing()"><i class="fa-solid fa-pencil"></i> Continue Editing</button>
      <button class="btn btn-secondary" disabled style="opacity:.4" title="Coming soon"><i class="fa-solid fa-envelope"></i> Save &amp; Send Email</button>
      <button class="btn btn-primary" onclick="saveContract()" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Save Contract</button>
    </div>
  </div>
</main>

<script>
// Auth
fetch('/auth/me').then(r=>r.json()).then(u=>{
  if(!u.username){window.location.href='/login';return}
  var _un=document.getElementById('userName');if(_un)_un.textContent=u.username;
  const _tNames={team_a:'JV Spa Movers',team_b:'Clear Choice Movers'};
  var _ur=document.getElementById('userRole');if(_ur)_ur.textContent=u.role==='admin'?'Administrator':u.role==='delivery'?(_tNames[u.team]||'Delivery'):'Sales';
  // Delivery role: restrict to delivery pages only
  if(u.role==='delivery'){
    const _p=window.location.pathname;
    if(!_p.startsWith('/calendar')&&!_p.startsWith('/delivery/')&&!_p.startsWith('/acknowledgement/')){
      window.location.href='/calendar';return;
    }
  }
  // Notify deferred loaders (e.g. calendar waits for auth)
  if(typeof window._onAuthReady==='function')window._onAuthReady();
  var _sb=document.getElementById('sidebar');if(_sb)_sb.style.visibility='visible';
  document.body.style.visibility='visible';
  var _ua=document.getElementById('userAvatar');if(_ua)_ua.textContent=u.username[0].toUpperCase();
  window._userRole=u.role;
  if(u.role==='admin') document.querySelectorAll('.admin-only').forEach(el=>{
    if(el.tagName==='BUTTON'||el.tagName==='A') el.style.display='flex';
    else el.style.display='';
  });
}).catch(()=>window.location.href='/login');

// Sidebar accordion — auto-open based on current URL
function initSidebar(){
  const p=window.location.pathname;
  const searchMap={
    '/contracts':'contracts',
    '/status':'status',
  };
  for(const [prefix,id] of Object.entries(searchMap)){
    if(p.startsWith(prefix)){
      const sub=document.getElementById('sub-'+id);
      const btn=document.getElementById('nav-'+id);
      if(sub&&!sub.classList.contains('open')){
        sub.classList.add('open');
        if(btn) btn.classList.add('nav-open');
      }
    }
  }
}

function toggleNav(id){
  const sub=document.getElementById('sub-'+id);
  const btn=document.getElementById('nav-'+id);
  const isOpen=sub.classList.toggle('open');
  btn.classList.toggle('nav-open',isOpen);
}

// Mobile sidebar
function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('mobile-open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('mobile-open');
}

// Sign out
async function signOut(){
  await fetch('/auth/logout',{method:'POST'});
  window.location.href='/login';
}

// Toast
function showToast(msg,type='success'){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);
}

// Close action dropdowns on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.action-menu')){
    document.querySelectorAll('.action-dropdown.open').forEach(d=>d.classList.remove('open'));
  }
});

function toggleActionMenu(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  document.querySelectorAll('.action-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  dd.classList.toggle('open');
}

initSidebar();
</script>
<script>
var draftData = null;

function continueEditing(){
  window.location.href = '/contracts/new';
}

function pKV(label,val){
  return val ? '<div class="pkv"><label>'+label+'</label><span>'+escHtml(val)+'</span></div>' : '';
}
function fmtUSDate(iso){
  if(!iso) return iso;
  var p=String(iso).split('-');
  if(p.length!==3) return iso;
  return parseInt(p[1],10)+'-'+p[2]+'-'+p[0];
}
function pcb(label,checked){
  return '<span class="'+(checked?'pcb-yes':'pcb-no')+'">'+(checked?'\u2713':'\u25cb')+' '+label+'</span> ';
}
function pRow(item,opts,price,included){
  return '<tr><td>'+item+'</td><td style="font-size:11px;color:var(--text-muted)">'+(opts||'')+'</td><td class="price">'+(price?'$'+price:'\u2014')+'</td><td class="incl">'+(included?'\u2713':'')+'</td></tr>';
}

function renderPreview(d){
  var cu=d.customer||{},pr=d.product||{},wa=d.warranty||{};
  var sv=d.service||{},el=d.electrical||{},mi=d.misc||{};
  var de=d.details||{},co=d.costing||{},pa=d.payment||{};
  var mfg=wa.manufacturer||{},dlr=wa.dealership||{};
  var hasPending=parseFloat(pa.duePriorToDelivery||0)>0;

  var html='';

  if(d.store) html+='<span class="store-hl"><i class="fa-solid fa-store"></i> '+escHtml(d.store)+'</span>';
  html+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap">';
  html+='<span>Date: <strong>'+(d.date?fmtUSDate(d.date):'\u2014')+'</strong></span>';
  html+='<span>Salesman: <strong>'+escHtml(d.salesman||'\u2014')+'</strong></span>';
  if(d.deliveryDate) html+='<span>Delivery: <strong>'+fmtUSDate(d.deliveryDate)+'</strong></span>';
  html+='</div>';

  html+='<div class="preview-section"><h3>Customer</h3><div class="preview-grid">';
  html+=pKV('Name',cu.name)+pKV('Email',cu.email)+pKV('Cell',cu.phone&&cu.phone.cell)+pKV('Home',cu.phone&&cu.phone.home);
  html+=pKV('Address',(cu.address||'')+' '+(cu.city||'')+' '+(cu.state||'')+' '+(cu.zip||''));
  html+=pKV('How Heard',cu.heardAbout)+pKV('Gated',cu.gated?(cu.gateCode?'Yes - '+cu.gateCode:'Yes'):'No');
  html+='</div></div>';

  html+='<div class="preview-section"><h3>Product</h3><div class="preview-grid">';
  html+=pKV('Status',pr.status==='instock'?'In Stock':pr.status==='tbo'?'To Be Ordered':'Special Order');
  html+=pKV('Make / Series / Model',[pr.make,pr.series,pr.model].filter(Boolean).join(' - '));
  html+=pKV('Year',pr.year)+pKV('Serial Number',pr.serialNumber);
  html+=pKV('Shell Color',pr.shellColor)+pKV('Cabinet Color',pr.cabinetColor)+pKV('Cover Color',pr.coverColor);
  html+='</div>';
  if(pr.included&&pr.included.speaker){
    html+='<div style="margin-top:8px">'+pcb('Speaker',pr.included.speaker)+'</div>';
  }
  html+='</div>';

  html+='<div class="preview-section"><h3>Warranty</h3><div class="preview-grid">';
  html+=pKV('Manufacturer Brands',(mfg.brands||[]).join(', '));
  html+=pKV('Mfg Component Yrs',mfg.componentYrs)+pKV('Mfg Shell Yrs',mfg.shellYrs)+pKV('Mfg Ext Warranty Yrs',mfg.extWarrantyYrs);
  html+=pKV('Dealership Brands',(dlr.brands||[]).join(', '));
  html+=pKV('Dlr Component Yrs',dlr.componentYrs)+pKV('Dlr Shell Yrs',dlr.shellYrs)+pKV('Dlr Ext Warranty Yrs',dlr.extWarrantyYrs);
  html+='</div></div>';

  html+='<div class="preview-section"><h3>Service</h3><div style="font-size:13px;line-height:2">';
  html+=pcb('In-Town Delivery',sv.inTownDelivery)+pcb('Crane',sv.crane);
  if(sv.crane&&sv.craneFee) html+='<span style="font-size:12px;color:var(--text-muted)">Fee: $'+sv.craneFee+'</span> ';
  if(sv.outOfTownDelivery) html+=pcb('Out-of-Town Delivery ($'+(sv.outOfTownDeliveryFee||'\u2014')+')',true);
  if(sv.outOfTownWarranty) html+=pcb('Out-of-Town Warranty ($'+(sv.outOfTownWarrantyFee||'\u2014')+')',true);
  html+='</div></div>';

  html+='<div class="preview-section"><h3>Electrical</h3><div style="font-size:13px;line-height:2">';
  html+=pcb('Pamphlet Provided',el.pamphletProvided)+pcb('Own Electrician',el.ownElectrician);
  html+='<div style="font-size:12px;color:var(--text-muted);margin-top:4px">Note: '+escHtml(el.notes||'No Note Available')+'</div>';
  html+='</div></div>';

  html+='<div class="preview-section"><h3>Miscellaneous</h3><div style="font-size:13px;line-height:2">';
  if(mi.monthlyCleanings) html+=pcb('Monthly Cleanings'+(mi.cleaningPrice?' ($'+mi.cleaningPrice+')':''),true);
  html+='<div style="font-size:12px;color:var(--text-muted);margin-top:4px">Note: '+escHtml(mi.notes||'No Note Available')+'</div>';
  html+='</div></div>';

  html+='<div class="preview-section"><h3>Details &amp; Line Items</h3>';
  html+='<table class="preview-table"><thead><tr><th>Item</th><th>Options</th><th style="text-align:right">Price</th><th style="text-align:center">Incl.</th></tr></thead><tbody>';
  html+=pRow('Spa '+(pr.make||'')+' '+(pr.model||'')+(pr.serialNumber?' ('+pr.serialNumber+')':''),'',de.spaPrice,de.spaIncluded);
  html+=pRow('U.L. Cover',[(de.cover&&de.cover.coverType||[]).join('/'),de.cover&&de.cover.brand,de.cover&&de.cover.lift].filter(Boolean).join(' - '),de.cover&&de.cover.price,de.cover&&de.cover.included);
  html+=pRow('Steps',de.steps&&de.steps.type||'',de.steps&&de.steps.price,de.steps&&de.steps.included);
  html+=pRow('Subpanel',(de.subpanel&&de.subpanel.provided?'Yes':'No')+(de.subpanel&&de.subpanel.amperage?' '+de.subpanel.amperage+' Amp':''),de.subpanel&&de.subpanel.price,de.subpanel&&de.subpanel.included);
  html+=pRow('Water Care System',de.waterCareSystem&&de.waterCareSystem.type||'',de.waterCareSystem&&de.waterCareSystem.price,de.waterCareSystem&&de.waterCareSystem.included);
  if(de.upgradedWaterCare&&(de.upgradedWaterCare.autoDosing||de.upgradedWaterCare.fwssIq)) html+=pRow('Upgraded Water Care',[(de.upgradedWaterCare.autoDosing?'Auto Dosing':'')+(de.upgradedWaterCare.fwssIq?' FWSS/IQ':'')].join('').trim(),de.upgradedWaterCare.price,de.upgradedWaterCare.included);
  html+=pRow('Startup Chemicals',de.startupChemicals&&de.startupChemicals.yes?'Yes':'No',de.startupChemicals&&de.startupChemicals.price,de.startupChemicals&&de.startupChemicals.included);
  if(de.coolZone&&de.coolZone.yes) html+=pRow('CoolZone',de.coolZone.extWarranty?'+ Ext Warranty':'',de.coolZone.price,false);
  if(de.accessories&&(de.accessories.items&&de.accessories.items.length||de.accessories.other)) html+=pRow('Accessories',[...(de.accessories.items||[]),de.accessories.other||''].filter(Boolean).join(', '),de.accessories.price,de.accessories.included);
  if(de.spaRemoval&&de.spaRemoval.yes) html+=pRow('Spa Removal','',de.spaRemoval.price,false);
  if(de.fuelSurcharge&&de.fuelSurcharge.yes) html+=pRow('Fuel Surcharge','',de.fuelSurcharge.price,false);
  if(de.concierge&&de.concierge.yes) html+=pRow('Concierge Service','',de.concierge.price,false);
  html+='</tbody></table></div>';

  html+='<div class="preview-section"><h3>Costing &amp; Payment</h3><div style="max-width:300px;margin-left:auto;font-size:13px">';
  if(co.subtotal) html+='<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--text-muted)">Subtotal</span><span>$'+co.subtotal+'</span></div>';
  if(co.taxAmount) html+='<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--text-muted)">Tax ('+co.taxPercent+'%)</span><span>$'+co.taxAmount+'</span></div>';
  if(co.productTotal) html+='<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--text-muted)">Product Total</span><span>$'+co.productTotal+'</span></div>';
  if(co.serviceTotal) html+='<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="color:var(--text-muted)">Service Total</span><span>$'+co.serviceTotal+'</span></div>';
  html+='</div><div class="totals-box"><div class="grand">Grand Total: $'+(co.grandTotal||'\u2014')+'</div></div>';
  if(hasPending) html+='<div class="pending-box"><i class="fa-solid fa-triangle-exclamation"></i> Due Prior to Delivery: $'+pa.duePriorToDelivery+'</div>';
  html+='<div style="margin-top:12px;font-size:13px;line-height:1.9">';
  if(pa.cheque&&pa.cheque.selected) html+='<strong style="color:var(--green)">\u2713 Cheque #'+pa.cheque.number+' - $'+(pa.cheque.amount||'\u2014')+'</strong><br>';
  if(pa.creditCard&&pa.creditCard.selected) html+='<strong style="color:var(--green)">\u2713 Credit Card' + (pa.creditCard.lastFour?' (ending '+pa.creditCard.lastFour+')':'') + (pa.creditCard.amount?' - $'+pa.creditCard.amount:'') + '</strong><br>';
  if(pa.cash&&pa.cash.selected) html+='<strong style="color:var(--green)">\u2713 Cash - $'+(pa.cash.amount||'\u2014')+'</strong><br>';
  if(pa.finance&&pa.finance.selected) html+='<strong style="color:var(--green)">\u2713 Finance - $'+(pa.finance.amount||'\u2014')+'</strong><br>';
  html+='</div></div>';

  document.getElementById('previewBody').innerHTML=html;
}

async function saveContract(){
  if(!draftData){showToast('No draft data found','error');return;}
  var btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
  document.getElementById('savingSpinner').style.display='flex';

  try{
    var fd=new FormData();
    fd.append('data',JSON.stringify(draftData));
    var r=await fetch('/api/contracts',{method:'POST',body:fd});
    var j=await r.json();
    if(!r.ok)throw new Error(j.error||'Save failed');
    sessionStorage.removeItem('draftContract');
    showToast(j.contractNumber+' saved!','success');
    setTimeout(function(){window.location.href='/contracts/'+j.contractId},1500);
  }catch(e){
    showToast('Error: '+e.message,'error');
    btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Save Contract';
    document.getElementById('savingSpinner').style.display='none';
  }
}

function showToast(msg,type){
  var t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.className='toast '+(type||'success')+' show';
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},3500);
}

// Load draft from sessionStorage
var stored=sessionStorage.getItem('draftContract');
if(!stored){
  document.getElementById('previewBody').innerHTML='<div style="text-align:center;padding:40px;color:var(--text-muted)"><i class="fa-solid fa-triangle-exclamation" style="font-size:24px;display:block;margin-bottom:10px;color:var(--yellow)"></i>No draft found. <a href="/contracts/new" style="color:var(--accent)">Start a new contract</a></div>';
}else{
  draftData=JSON.parse(stored);
  renderPreview(draftData);
}
</script>
</body>
</html>
