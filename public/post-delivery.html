<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post-Delivery Follow-up — Desert Hot Tubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#f2f6fa;--surface:#ffffff;--surface2:#f7fafc;
  --border:#dde5ef;--text:#1e2d3d;--text-muted:#64778f;--text-light:#8fa3b8;
  --accent:#2b6cb0;--accent-bg:#ebf4ff;--accent-light:#bee3f8;
  --green:#276749;--green-bg:#f0fff4;--green-light:#c6f6d5;
  --red:#c53030;--red-bg:#fff5f5;--red-light:#fed7d7;
  --yellow:#b7791f;--yellow-bg:#fefcbf;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07);
  --shadow-lg:0 10px 15px rgba(0,0,0,.08);
  --radius:8px;--font:"DM Sans",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}

/* Sidebar */
.sidebar{visibility:hidden;width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;transition:transform .25s}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-logo{width:150px;height:auto;display:block}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;color:var(--text-muted);text-decoration:none;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.nav-item i{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item .nav-arrow{margin-left:auto;font-size:10px;transition:transform .2s}
.nav-item.nav-open .nav-arrow{transform:rotate(90deg)}
.nav-item.disabled{opacity:.4;pointer-events:none}
.nav-sub{display:none;background:var(--surface2)}
.nav-sub.open{display:block}
.nav-sub-item{display:flex;align-items:center;gap:9px;padding:7px 16px 7px 40px;color:var(--text-muted);text-decoration:none;font-size:12.5px;transition:background .12s,color .12s}
.nav-sub-item:hover,.nav-sub-item.active{background:var(--accent-bg);color:var(--accent)}
.nav-divider{border:none;border-top:1px solid var(--border);margin:8px 0}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding:8px 0}
.user-chip{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.user-name{font-size:12px;font-weight:500}.user-role{font-size:10px;color:var(--text-light)}
.nav-badge-soon{font-size:9px;font-weight:600;background:var(--surface2);border:1px solid var(--border);color:var(--text-light);padding:1px 6px;border-radius:10px;margin-left:auto}

/* Mobile hamburger */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;box-shadow:var(--shadow)}
.mobile-home-btn{display:none;position:fixed;top:12px;right:12px;z-index:200;width:38px;height:38px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);align-items:center;justify-content:center;color:var(--text-muted);text-decoration:none;font-size:15px}
@media(max-width:768px){.mobile-home-btn{display:flex !important}}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49}
@media(max-width:768px){
  .hamburger{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
  .sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar-overlay.mobile-open{display:block}
  body{visibility:hidden}
.main{padding:16px !important;padding-top:56px !important}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr !important}
}

/* Main */
.main{flex:1;padding:28px 32px;min-width:0}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-header h1{font-size:20px;font-weight:600}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-header i{color:var(--accent);font-size:13px}

/* Buttons */
.btn{padding:9px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);transition:opacity .15s}
.btn:hover{opacity:.88}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-light)}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}

/* Badges */
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;display:inline-block}
.badge-assigned{background:var(--accent-bg);color:var(--accent)}
.badge-tbo{background:var(--yellow-bg);color:var(--yellow)}
.badge-scheduled{background:#e9d8fd;color:#553c9a}
.badge-delivered{background:var(--green-bg);color:var(--green)}
.badge-cancelled{background:var(--red-bg);color:var(--red)}
.badge-awaiting{background:var(--yellow-bg);color:var(--yellow)}
.badge-complete{background:var(--green-bg);color:var(--green)}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* Form */
label.lbl{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,108,176,.12)}
textarea{resize:vertical;min-height:60px}

/* Chips */
.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.chip:hover{border-color:var(--accent-light);color:var(--accent)}
.chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:500}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;box-shadow:var(--shadow-lg);transform:translateY(80px);opacity:0;transition:all .3s;z-index:999}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-width:500px;width:90%;padding:24px}

/* Three-dot menu */
.action-menu{position:relative;display:inline-block}
.three-dot-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:16px;color:var(--text-muted);line-height:1}
.three-dot-btn:hover{background:var(--border)}
.action-dropdown{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);min-width:160px;z-index:60}
.action-dropdown.open{display:block}
.action-dropdown button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;background:none;border:none;font-size:13px;cursor:pointer;color:var(--text);font-family:var(--font);text-align:left}
.action-dropdown button:hover{background:var(--surface2)}
.action-dropdown button.danger{color:var(--red)}
.action-dropdown button:disabled{opacity:.45;cursor:not-allowed}
.action-dropdown hr{border:none;border-top:1px solid var(--border);margin:4px 0}
</style>
<style>
.hamburger{display:none!important}
@media(max-width:768px){.hamburger{display:flex!important}}
.ack-tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:24px}
.ack-tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border:none;background:none;font-family:var(--font);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;display:flex;align-items:center;gap:6px}
.ack-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ack-table{width:100%;border-collapse:collapse;font-size:13px}
.ack-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);background:var(--surface2)}
.ack-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.ack-table tr:hover td{background:var(--surface2)}
.btn-plus{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.btn-plus:hover{opacity:.85}
.btn-eye{width:32px;height:32px;border-radius:6px;background:var(--surface2);color:var(--accent);border:1px solid var(--border);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn-eye:hover{background:var(--accent-bg)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-bar input,.search-bar select{font-size:13px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--font)}
.search-bar input{flex:1;min-width:180px}
.date-input-wrap{position:relative;flex:1;min-width:150px}
.date-input-wrap input[type=text]{width:100%;padding-right:32px}
.date-input-wrap input[type=text].input-error{border-color:var(--red)}
.date-pick-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;font-size:13px;line-height:1}
.date-pick-btn:hover{color:var(--accent)}
.date-native-hidden{position:absolute;inset:0;opacity:0;pointer-events:none;width:1px;height:1px}
.slot-pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;white-space:nowrap}
.gen-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.modal-list-row{padding:12px 14px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);margin-bottom:8px;transition:all .15s}
.modal-list-row:hover{background:var(--accent-bg);border-color:var(--accent)}
.ack-cards{display:none}
.ack-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.ack-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.ack-card-name{font-weight:600;font-size:14px}
.ack-card-store{font-size:11px;color:var(--text-muted);margin-top:2px}
.ack-card-meta{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.ack-card-address{font-size:12px;color:var(--text-muted);margin-bottom:8px}
@media(max-width:768px){
  .ack-table{display:none !important}
  .ack-cards{display:block !important}
}
</style>
</head>

<script>
// Auth
fetch('/auth/me').then(r=>r.json()).then(u=>{
  if(!u.username){window.location.href='/login';return}
  var _un=document.getElementById('userName');if(_un)_un.textContent=u.username;
  const _tNames={team_a:'JV Spa Movers',team_b:'Clear Choice Movers'};
  var _ur=document.getElementById('userRole');if(_ur)_ur.textContent=u.role==='admin'?'Administrator':u.role==='delivery'?(_tNames[u.team]||'Delivery'):'Sales';
  // Delivery role: restrict to delivery pages only
  if(u.role==='delivery'){
    const _p=window.location.pathname;
    if(!_p.startsWith('/calendar')&&!_p.startsWith('/delivery/')&&!_p.startsWith('/acknowledgement/')){
      window.location.href='/calendar';return;
    }
  }
  // Notify deferred loaders (e.g. calendar waits for auth)
  if(typeof window._onAuthReady==='function')window._onAuthReady();
  var _sb=document.getElementById('sidebar');if(_sb)_sb.style.visibility='visible';
  document.body.style.visibility='visible';
  var _ua=document.getElementById('userAvatar');if(_ua)_ua.textContent=u.username[0].toUpperCase();
  window._userRole=u.role;
  window._userTeam=u.team||null;
  if(u.role==='delivery'){
    document.querySelectorAll('.nav-item:not([href="/calendar"])').forEach(function(el){
      if(el.querySelector('.fa-right-from-bracket')) return; // keep sign out
      el.style.display='none';
    });
  }
  if(u.role==='admin') document.querySelectorAll('.admin-only').forEach(el=>{
    if(el.tagName==='BUTTON'||el.tagName==='A') el.style.display='flex';
    else el.style.display='';
  });
}).catch(()=>window.location.href='/login');

// Sidebar accordion — auto-open based on current URL
function initSidebar(){
  const p=window.location.pathname;
  const searchMap={
    '/contracts':'contracts',
    '/status':'status',
  };
  for(const [prefix,id] of Object.entries(searchMap)){
    if(p.startsWith(prefix)){
      const sub=document.getElementById('sub-'+id);
      const btn=document.getElementById('nav-'+id);
      if(sub&&!sub.classList.contains('open')){
        sub.classList.add('open');
        if(btn) btn.classList.add('nav-open');
      }
    }
  }
}

function toggleNav(id){
  const sub=document.getElementById('sub-'+id);
  const btn=document.getElementById('nav-'+id);
  const isOpen=sub.classList.toggle('open');
  btn.classList.toggle('nav-open',isOpen);
}

// Mobile sidebar
function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('mobile-open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('mobile-open');
}

// Sign out
async function signOut(){
  await fetch('/auth/logout',{method:'POST'});
  window.location.href='/login';
}

// Toast
function showToast(msg,type='success'){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);
}

// ── US date (M-DD-YYYY) text field <-> hidden ISO date input ─────────────────
function fmtUSDate(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  if(p.length!==3) return '';
  return parseInt(p[1],10)+'-'+p[2]+'-'+p[0];
}
function parseUSDate(str){
  str=(str||'').trim();
  if(!str) return null;
  const m=str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(!m) return null;
  const mo=parseInt(m[1],10),da=parseInt(m[2],10),yr=parseInt(m[3],10);
  if(mo<1||mo>12||da<1||da>31) return null;
  const pad=n=>String(n).padStart(2,'0');
  return {iso:yr+'-'+pad(mo)+'-'+pad(da), us:mo+'-'+pad(da)+'-'+yr};
}
function maskUSDateInput(el){
  el.value=el.value.replace(/[^\d\-]/g,'');
}
function syncDateFromText(textId,hiddenId){
  const t=document.getElementById(textId),h=document.getElementById(hiddenId);
  if(!t.value.trim()){h.value='';t.classList.remove('input-error');return}
  const parsed=parseUSDate(t.value);
  if(parsed){h.value=parsed.iso;t.value=parsed.us;t.classList.remove('input-error')}
  else{h.value='';t.classList.add('input-error');showToast('Enter date as M-DD-YYYY','error')}
}
function syncTextFromDate(hiddenId,textId){
  const h=document.getElementById(hiddenId),t=document.getElementById(textId);
  t.value=fmtUSDate(h.value);
  t.classList.remove('input-error');
}
function openDatePicker(hiddenId){
  const h=document.getElementById(hiddenId);
  if(h.showPicker){try{h.showPicker()}catch(e){h.focus()}}else{h.focus();h.click()}
}

// Close action dropdowns on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.action-menu')){
    document.querySelectorAll('.action-dropdown.open').forEach(d=>d.classList.remove('open'));
  }
});

function toggleActionMenu(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  document.querySelectorAll('.action-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  dd.classList.toggle('open');
}

initSidebar();

<script>
const contractId = location.pathname.split('/').pop();
const ratings = { contacted:null, google_review:null, rating_delivery:null, rating_installation:null, rating_explanation:null, rating_confidence:null, rating_overall:null };

const RATING_QUESTIONS = [
  ['rating_delivery',     'How satisfied were you with the delivery?'],
  ['rating_installation', 'How satisfied were you with the installation and setup?'],
  ['rating_explanation',  'How satisfied are you with the explanation provided on how to operate your hot tub?'],
  ['rating_confidence',   'How confident do you feel using the controls and features of your hot tub?'],
  ['rating_overall',      'Overall, how satisfied are you with your hot tub purchase?'],
];

function fmtDateTime(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return iso; }
}

async function init() {
  const el = document.getElementById('pageBody');
  const res = await fetch('/api/post-delivery/contract/'+contractId);
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    el.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--text-muted)">'
      + '<i class="fa-solid fa-circle-check fa-2x" style="display:block;margin-bottom:12px;color:var(--green)"></i>'
      + (err.error || 'Feedback is not available for this contract') + '</div>';
    return;
  }
  const c = await res.json();
  renderForm(c);
}

function renderForm(c) {
  var html = '';
  html += '<div class="card">'
    + '<div class="card-header"><i class="fa-solid fa-circle-info"></i> Customer & Delivery Details</div>'
    + '<div class="grid-2">'
    + field('Customer Name', c.customer_name)
    + field('Delivery Date & Time', c.scheduled_datetime ? fmtDateTime(c.scheduled_datetime) : fmtDateTime(c.delivery_date))
    + field('Address', c.address)
    + field('Phone', c.phone)
    + field('Email', c.email)
    + field('Make / Model', [c.make,c.model].filter(Boolean).join(' / '))
    + '</div></div>';

  html += '<div class="card">'
    + '<div class="card-header"><i class="fa-solid fa-phone"></i> Follow-up Call</div>'
    + '<label class="lbl">Has the customer been contacted after delivery and installation?</label>'
    + '<div class="chip-group" id="contactedGroup">'
    + '<button type="button" class="chip" onclick="setContacted(1)" id="chip-contacted-yes">Yes</button>'
    + '<button type="button" class="chip" onclick="setContacted(0)" id="chip-contacted-no">No</button>'
    + '</div></div>';

  html += '<div class="card">'
    + '<div class="card-header"><i class="fa-brands fa-google"></i> Google Review</div>'
    + '<label class="lbl">Has the customer provided a Google review?</label>'
    + '<div class="chip-group" id="googleReviewGroup">'
    + '<button type="button" class="chip" onclick="setGoogleReview(1)" id="chip-google_review-yes">Yes</button>'
    + '<button type="button" class="chip" onclick="setGoogleReview(0)" id="chip-google_review-no">No</button>'
    + '</div></div>';

  html += '<div class="card"><div class="card-header"><i class="fa-solid fa-star"></i> Satisfaction Ratings</div>';
  RATING_QUESTIONS.forEach(function(q, i){
    html += '<div style="margin-bottom:'+(i<RATING_QUESTIONS.length-1?'16px':'0')+'">'
      + '<label class="lbl">'+(i+1)+'. '+q[1]+'</label>'
      + '<div class="chip-group" id="group-'+q[0]+'">' + ratingChips(q[0]) + '</div>'
      + '</div>';
  });
  html += '</div>';

  html += '<div class="card">'
    + '<div class="card-header"><i class="fa-solid fa-comment"></i> Questions or Concerns</div>'
    + '<textarea id="concernsText" placeholder="Do you have any questions or concerns that we can help with?"></textarea>'
    + '</div>';

  html += '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">'
    + '<button class="btn btn-primary" onclick="submitFeedback()"><i class="fa-solid fa-paper-plane"></i> Submit</button>'
    + '</div>';

  document.getElementById('pageBody').innerHTML = html;
}

function field(label, value) {
  return '<div><label class="lbl">'+label+'</label><div style="font-size:13px;padding:6px 0">'+(value||'—')+'</div></div>';
}

function ratingChips(field) {
  var html = '';
  for (var n=1; n<=5; n++) html += '<button type="button" class="chip" onclick="setRating(\''+field+'\','+n+')" id="chip-'+field+'-'+n+'">'+n+'</button>';
  return html;
}

function setContacted(val) {
  ratings.contacted = val;
  document.getElementById('chip-contacted-yes').classList.toggle('active', val===1);
  document.getElementById('chip-contacted-no').classList.toggle('active', val===0);
}

function setGoogleReview(val) {
  ratings.google_review = val;
  document.getElementById('chip-google_review-yes').classList.toggle('active', val===1);
  document.getElementById('chip-google_review-no').classList.toggle('active', val===0);
}

function setRating(field, n) {
  ratings[field] = n;
  for (var i=1; i<=5; i++) document.getElementById('chip-'+field+'-'+i).classList.toggle('active', i===n);
}

async function submitFeedback() {
  if (ratings.contacted===null) return showToast('Please answer the contacted question','error');
  if (ratings.google_review===null) return showToast('Please answer the Google review question','error');
  for (var i=0; i<RATING_QUESTIONS.length; i++) {
    if (!ratings[RATING_QUESTIONS[i][0]]) return showToast('Please answer all rating questions','error');
  }
  const body = Object.assign({}, ratings, { concerns_text: document.getElementById('concernsText').value });
  const res = await fetch('/api/post-delivery/feedback/'+contractId, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) return showToast(data.error || 'Failed to submit feedback','error');
  showToast('Feedback submitted');
  setTimeout(function(){ window.location.href='/post-delivery'; }, 900);
}

init();
</script>
</body>
</html>
