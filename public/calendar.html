<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar — Desert Hot Tubs</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/util.js"></script>
<style>
.page-header{flex-shrink:0}
#calendarWrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:var(--shadow); flex:1; display:flex; flex-direction:column; min-height:0; }
#calendar { flex:1; min-height:0; }
.fc { font-family:var(--font); font-size:13px; height:100%; }

/* Toolbar */
.fc .fc-toolbar { flex-wrap:wrap; gap:10px; margin-bottom:16px !important; }
.fc-toolbar-title { font-size:18px !important; font-weight:700; color:var(--text); }
.fc-button { font-family:var(--font) !important; font-size:12px !important; font-weight:500 !important; background:var(--surface2) !important; color:var(--text) !important; border:1px solid var(--border) !important; border-radius:var(--radius) !important; padding:7px 14px !important; box-shadow:none !important; transition:background .15s,border-color .15s; }
.fc-button:hover { background:var(--accent-bg) !important; border-color:var(--accent-light) !important; }
.fc-button-active, .fc-button-active:hover { background:var(--accent) !important; color:#fff !important; border-color:var(--accent) !important; outline:none !important; box-shadow:none !important; }
.fc-button:focus { outline:none !important; box-shadow:0 0 0 3px rgba(43,108,176,.15) !important; }
.fc-today-button { text-transform:capitalize; }
.fc-icon { font-size:15px; }

/* Grid */
.fc-theme-standard td, .fc-theme-standard th { border-color:var(--border); }
.fc-col-header-cell { background:var(--surface2); padding:8px 0; }
.fc-col-header-cell-cushion { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); text-decoration:none; }
.fc-daygrid-day-number { font-size:12px; color:var(--text); text-decoration:none; padding:6px; }
.fc-day-today { background:var(--accent-bg) !important; }
.fc-day-today .fc-daygrid-day-number { color:var(--accent); font-weight:700; }
.fc-timegrid-slot-label-cushion { font-size:11px; color:var(--text-muted); }
.fc-timegrid-axis-cushion { font-size:11px; color:var(--text-muted); }

/* Events */
.fc-event { cursor:pointer; border-radius:8px; font-size:11px; border-width:0 0 0 3px; box-shadow:var(--shadow); }
.fc-daygrid-event { white-space:nowrap; overflow:hidden; margin-top:2px; }
.fc-timegrid-event { border-radius:8px; padding:2px; }
.fc-timegrid-slot { height:60px !important; }
.fc-timegrid-event-harness:has(.event-day) { height:158px !important; }

@media(max-width:768px){
  .fc-toolbar-title { font-size:15px !important; }
  .fc-button { padding:6px 10px !important; font-size:11px !important; }
  .fc .fc-toolbar.fc-header-toolbar { flex-direction:column; align-items:stretch; }
}
.event-month { padding:2px 4px; line-height:1.3; }
.event-month .ev-num { font-weight:600; font-size:11px; }
.event-month .ev-name { font-size:10px; opacity:.85; }
.event-time .ev-num { font-weight:600; display:block; }
.event-time .ev-model { opacity:.75; display:block; font-size:10px; }
.event-time .ev-addr { opacity:.65; display:block; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.event-day .ev-num { font-weight:700; font-size:12px; display:block; }
.event-day .ev-name { font-size:11px; display:block; margin-top:1px; }
.event-day .ev-model { font-size:11px; opacity:.8; display:block; }
.event-day .ev-serial { font-size:10px; opacity:.7; display:block; }
.event-day .ev-sal { font-size:10px; opacity:.7; display:block; }
.event-day .ev-addr { font-size:10px; opacity:.7; display:block; }
</style>
</head>
<body>
<button class="hamburger" onclick="openMobileSidebar()"><i class="fa-solid fa-bars"></i> Menu</button>
<a class="mobile-home-btn" href="/dashboard" aria-label="Home"><i class="fa-solid fa-house"></i></a>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header"><a href="/dashboard" class="brand-mark"><span class="brand-glyph">DHT</span><span class="brand-text"><span class="brand-name">Desert Hot Tubs</span><span class="brand-sub">Sales &amp; Delivery</span></span></a></div>
  <div>
    <button class="nav-item " id="nav-contracts" onclick="toggleNav('contracts')">
      <i class="fa-solid fa-file-contract"></i>Contracts<i class="fa-solid fa-chevron-right nav-arrow"></i>
    </button>
    <div class="nav-sub " id="sub-contracts">
      <a class="nav-sub-item " href="/contracts/new"><i class="fa-solid fa-plus"></i> New Contract</a>
      <a class="nav-sub-item " href="/contracts"><i class="fa-solid fa-list"></i> View Contracts</a>
    </div>
  </div>
  <div>
    <button class="nav-item " id="nav-status" onclick="toggleNav('status')">
      <i class="fa-solid fa-chart-gantt"></i>Status<i class="fa-solid fa-chevron-right nav-arrow"></i>
    </button>
    <div class="nav-sub " id="sub-status">
      <a class="nav-sub-item " href="/status?tab=assigned"><i class="fa-solid fa-circle-check"></i> Assigned</a>
      <a class="nav-sub-item " href="/status?tab=tbo"><i class="fa-solid fa-box"></i> To Be Ordered</a>
      <a class="nav-sub-item " href="/status?tab=received"><i class="fa-solid fa-truck-arrow-right"></i> Received</a>
      <a class="nav-sub-item " href="/status?tab=scheduled"><i class="fa-solid fa-calendar-check"></i> Scheduled</a>
      <a class="nav-sub-item " href="/status?tab=delivered"><i class="fa-solid fa-truck-ramp-box"></i> Delivered</a>
      <a class="nav-sub-item " href="/status?tab=cancelled"><i class="fa-solid fa-ban"></i> Cancelled</a>
    </div>
  </div>
  <a class="nav-item active" href="/calendar"><i class="fa-solid fa-calendar"></i>Calendar</a>
  <a class="nav-item" href="/acknowledgement"><i class="fa-solid fa-clipboard-check"></i>Acknowledgement</a>
  <a class="nav-item " href="/post-delivery"><i class="fa-solid fa-phone"></i>Post-Delivery Follow-up</a>
  <hr class="nav-divider">
  <div class="sidebar-bottom">
    <a class="nav-item " href="/settings"><i class="fa-solid fa-gear"></i>Settings</a>
    <button class="nav-item" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i>Sign Out</button>
    <div class="user-chip">
      <div class="user-avatar" id="userAvatar">?</div>
      <div><div class="user-name" id="userName">…</div><div class="user-role" id="userRole"></div></div>
    </div>
  </div>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
<main class="main">
  <div class="page-header"><h1>Delivery Calendar</h1></div>
  <div id="calendarWrap">
    <div id="calendar"></div>
  </div>
</main>
<script>
// Auth
fetch('/auth/me').then(r=>r.json()).then(u=>{
  if(!u.username){window.location.href='/login';return}
  var _un=document.getElementById('userName');if(_un)_un.textContent=u.username;
  const _tNames={team_a:'JV Spa Movers',team_b:'Clear Choice Movers'};
  var _ur=document.getElementById('userRole');if(_ur)_ur.textContent=u.role==='admin'?'Administrator':u.role==='delivery'?(_tNames[u.team]||'Delivery'):'Sales';
  // Delivery role: restrict to delivery pages only
  if(u.role==='delivery'){
    const _p=window.location.pathname;
    if(!_p.startsWith('/calendar')&&!_p.startsWith('/delivery/')&&!_p.startsWith('/acknowledgement/')){
      window.location.href='/calendar';return;
    }
  }
  // Notify deferred loaders (e.g. calendar waits for auth)
  if(typeof window._onAuthReady==='function')window._onAuthReady();
  var _sb=document.getElementById('sidebar');if(_sb)_sb.style.visibility='visible';
  document.body.style.visibility='visible';
  var _ua=document.getElementById('userAvatar');if(_ua)_ua.textContent=u.username[0].toUpperCase();
  window._userRole=u.role;
  window._userTeam=u.team||null;
  if(u.role==='delivery'){
    document.querySelectorAll('.nav-item:not([href="/calendar"])').forEach(function(el){
      if(el.querySelector('.fa-right-from-bracket')) return; // keep sign out
      el.style.display='none';
    });
  }
  if(u.role==='admin') document.querySelectorAll('.admin-only').forEach(el=>{
    if(el.tagName==='BUTTON'||el.tagName==='A') el.style.display='flex';
    else el.style.display='';
  });
}).catch(()=>window.location.href='/login');

// Sidebar accordion — auto-open based on current URL
function initSidebar(){
  const p=window.location.pathname;
  const searchMap={
    '/contracts':'contracts',
    '/status':'status',
  };
  for(const [prefix,id] of Object.entries(searchMap)){
    if(p.startsWith(prefix)){
      const sub=document.getElementById('sub-'+id);
      const btn=document.getElementById('nav-'+id);
      if(sub&&!sub.classList.contains('open')){
        sub.classList.add('open');
        if(btn) btn.classList.add('nav-open');
      }
    }
  }
}

function toggleNav(id){
  const sub=document.getElementById('sub-'+id);
  const btn=document.getElementById('nav-'+id);
  const isOpen=sub.classList.toggle('open');
  btn.classList.toggle('nav-open',isOpen);
}

// Mobile sidebar
function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('mobile-open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('mobile-open');
}

// Sign out
async function signOut(){
  await fetch('/auth/logout',{method:'POST'});
  window.location.href='/login';
}

// Toast
function showToast(msg,type='success'){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);
}

// Close action dropdowns on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.action-menu')){
    document.querySelectorAll('.action-dropdown.open').forEach(d=>d.classList.remove('open'));
  }
});

function toggleActionMenu(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  document.querySelectorAll('.action-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  dd.classList.toggle('open');
}

initSidebar();
</script>
<script>
let calendarInstance = null;

// Phoenix is fixed UTC-7, no DST — add minutes to a naive Phoenix-local
// "YYYY-MM-DDTHH:mm:ss" string and return the result in the same naive form.
function addMinutesPhoenix(naiveStr, mins) {
  const instant = new Date(naiveStr + '-07:00').getTime() + mins * 60000;
  return new Date(instant - 7 * 3600000).toISOString().slice(0, 19);
}

async function loadCalendar() {
  const contracts = await fetch('/api/contracts').then(r=>r.json()).catch(()=>[]);
  const scheduled = contracts.filter(c=>c.status==='scheduled'&&c.scheduled_datetime);

  // Filter by team if delivery role
  const userRole = window._userRole;
  const userTeam = window._userTeam;
  const filtered = userRole === 'delivery'
    ? scheduled.filter(c => !c.delivery_team || c.delivery_team === userTeam)
    : scheduled;

  const TEAM_COLORS = { team_a:'#673116', team_b:'#059669' };
  const TEAM_BORDERS = { team_a:'#4a230f', team_b:'#047857' };

  const events = filtered.map(c => {
    const dur   = parseInt(c.scheduled_duration||120);
    const isDelivery = userRole === 'delivery';
    return {
      id:    String(c.id),
      title: (c.contract_number||'')+'|'+(c.customer_name||'')+'|'+(c.make||'')+' '+(c.model||'')+'|'+(c.serial_number||'')+'|'+(c.salesman||'')+'|'+(c.address||'')+(c.city?', '+c.city:''),
      start: c.scheduled_datetime,
      end:   addMinutesPhoenix(c.scheduled_datetime, dur),
      backgroundColor: TEAM_COLORS[c.delivery_team] || '#673116',
      borderColor:     TEAM_BORDERS[c.delivery_team] || '#4a230f',
      extendedProps: {
        contractNumber: c.contract_number,
        customerName:   c.customer_name,
        make:  c.make, model: c.model,
        serial: c.serial_number,
        salesman: c.salesman,
        address: (c.address||'')+(c.city?', '+c.city:''),
        contractId: c.id,
        duration: dur,
      }
    };
  });

  const el = document.getElementById('calendar');
  calendarInstance = new FullCalendar.Calendar(el, {
    initialView: 'dayGridMonth',
    timeZone:    'America/Phoenix',
    headerToolbar: {
      left:   'prev,next today',
      center: 'title',
      right:  'dayGridMonth,timeGridWeek,timeGridDay'
    },
    slotMinTime:  '06:00:00',
    slotMaxTime:  '20:00:00',
    slotDuration: '02:00:00',
    slotLabelInterval: '02:00',
    height:       'parent',
    events:       events,
    eventClick: function(info) {
      info.jsEvent.preventDefault();
      info.jsEvent.stopPropagation();
      const isDelivery = window._userRole === 'delivery';
      const cId = info.event.extendedProps.contractId;
      if (!cId) return;
      window.location.href = isDelivery ? '/delivery/' + cId : '/contracts/' + cId;
    },
    eventContent: function(info) {
      const p = info.event.extendedProps;
      const view = info.view.type;
      // No <a> tags — eventClick handles all navigation to avoid double-handler conflicts
      if (view === 'dayGridMonth') {
        return { html: '<div class="event-month"><span style="font-weight:600;font-size:11px;cursor:pointer">'+escHtml(p.contractNumber||'')+'</span><span class="ev-name"> · '+escHtml(p.customerName||'')+'</span></div>' };
      } else if (view === 'timeGridWeek') {
        return { html: '<div class="event-time"><span class="ev-num" style="cursor:pointer">'+escHtml(p.contractNumber||'')+'</span><span class="ev-model">'+escHtml(p.customerName||'')+'</span><span class="ev-model">'+escHtml(p.make||'')+' '+escHtml(p.model||'')+'</span></div>' };
      } else {
        // Day view — full detail
        return { html: '<div class="event-day" style="padding:4px">'
          +'<span class="ev-num" style="cursor:pointer">'+escHtml(p.contractNumber||'')+'</span>'
          +'<span class="ev-name">'+escHtml(p.customerName||'')+'</span>'
          +'<span class="ev-model">'+escHtml(p.make||'')+' '+escHtml(p.model||'')+'</span>'
          +(p.serial?'<span class="ev-serial">S/N: '+escHtml(p.serial)+'</span>':'')
          +(p.salesman?'<span class="ev-sal">&#128100; '+escHtml(p.salesman)+'</span>':'')
          +(p.address?'<span class="ev-addr">&#128205; '+escHtml(p.address)+'</span>':'')
          +'</div>' };
      }
    }
  });
  calendarInstance.render();
}

// Wait for auth to complete before loading (ensures _userRole and _userTeam are set)
window._onAuthReady = loadCalendar;
</script>
</body>
</html>
