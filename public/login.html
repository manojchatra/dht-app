<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Hot Tubs — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--font:"DM Sans",system-ui,sans-serif;--radius:20px;--radius-sm:10px}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
body{
  background-image:url("/img/login-bg.jpg");
  background-size:cover;
  background-position:center bottom;
  background-repeat:no-repeat;
  display:flex;align-items:center;justify-content:flex-end;
  min-height:100vh;padding:40px 8% 40px 40px;
}
body::after{
  content:"";position:fixed;inset:0;
  background:linear-gradient(135deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.22) 100%);
  pointer-events:none;z-index:0;
}
.login-card{
  position:relative;z-index:1;
  width:100%;max-width:400px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,.90);
  border-radius:var(--radius);
  padding:40px 36px 36px;
  box-shadow:0 20px 60px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.95);
}
.card-header{text-align:center;margin-bottom:32px}
.logo-wrap{display:flex;justify-content:center;margin-bottom:12px}
.logo-wrap img{width:210px;height:auto}
.card-sub{font-size:13px;color:rgba(90,68,52,.85);font-weight:400}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:rgba(90,68,52,.75);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.input-wrap{position:relative}
.input-wrap > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(140,110,90,.80);pointer-events:none}
.form-input{
  width:100%;padding:11px 14px 11px 38px;
  font-family:var(--font);font-size:14px;
  background:rgba(255,255,255,.55);
  border:1.5px solid rgba(210,190,172,.60);
  border-radius:var(--radius-sm);color:#2a1f18;outline:none;
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.form-input::placeholder{color:rgba(140,110,90,.65)}
.form-input:focus{background:rgba(255,255,255,.80);border-color:rgba(208,136,45,.75);box-shadow:0 0 0 3px rgba(208,136,45,.20)}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(140,110,90,.70);padding:4px;border-radius:6px;display:flex;align-items:center}
.pw-toggle svg{width:16px;height:16px}
.error-msg{display:none;align-items:center;gap:7px;background:rgba(220,60,50,.10);border:1px solid rgba(220,60,50,.30);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:#b91c1c;margin-bottom:14px}
.error-msg.show{display:flex}
.error-msg svg{width:16px;height:16px;flex-shrink:0}
.btn-login{
  width:100%;padding:12px;margin-top:26px;
  font-family:var(--font);font-size:14px;font-weight:600;
  background:#673116;color:#fbf3e8;
  border:1.5px solid #673116;
  border-radius:var(--radius-sm);cursor:pointer;
  transition:background .15s,transform .1s,box-shadow .15s;
  box-shadow:0 2px 12px rgba(103,49,22,.25);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:#4a230f;box-shadow:0 4px 20px rgba(103,49,22,.32);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-login.loading{opacity:.7;pointer-events:none}
.spinner{display:none;width:16px;height:16px;border:2px solid rgba(251,243,232,.35);border-top-color:#fbf3e8;border-radius:50%;animation:spin .65s linear infinite}
.btn-login.loading .spinner{display:block}
.btn-login.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.card-footer{text-align:center;margin-top:24px;font-size:12px;color:rgba(90,68,52,.60)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s ease}
@media(max-width:600px){
  body{padding:20px;align-items:center;justify-content:center}
  .login-card{max-width:100%}
}
</style>
</head>
<body>
<div class="login-card" id="loginCard">
  <div class="card-header">
    <div class="logo-wrap">
      <img src="/img/logo.webp" alt="Desert Hot Tubs">
    </div>
    <div class="card-sub">Sales &amp; Delivery Portal</div>
  </div>
  <div class="error-msg" id="errorMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errorText">Invalid username or password.</span>
  </div>
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" class="form-input" placeholder="Enter username" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input type="password" id="password" class="form-input" placeholder="Enter password" style="padding-right:38px" autocomplete="new-password">
        <button type="button" class="pw-toggle" onclick="togglePw()">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      <div class="spinner"></div>
      <span class="btn-text">Sign in</span>
    </button>
  </form>
  <div class="card-footer">Desert Hot Tubs &copy; 2026 &middot; Internal use only</div>
</div>
<script>
function togglePw(){
  const pw=document.getElementById("password"),icon=document.getElementById("eyeIcon");
  pw.type==="password"
    ?(pw.type="text",icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>')
    :(pw.type="password",icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>');
}
function showError(msg){
  document.getElementById("errorText").textContent=msg;
  document.getElementById("errorMsg").classList.add("show");
  const c=document.getElementById("loginCard");
  c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
}
function hideError(){document.getElementById("errorMsg").classList.remove("show")}
function setLoading(on){document.getElementById("loginBtn").classList.toggle("loading",on)}
document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const user=document.getElementById("username").value.trim();
  const pass=document.getElementById("password").value;
  if(!user||!pass){showError("Please enter both username and password.");return}
  hideError();setLoading(true);
  try{
    const r=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,password:pass})});
    const json=await r.json();
    if(r.ok){
      document.getElementById("loginBtn").innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      document.getElementById("loginBtn").style.background="rgba(200,255,220,.95)";
      setTimeout(()=>window.location.href="/dashboard",500);
    }else{
      setLoading(false);
      showError(json.error||"Invalid username or password.");
      document.getElementById("password").value="";
      document.getElementById("password").focus();
    }
  }catch(_){setLoading(false);showError("Connection error. Please try again.")}
});
</script>
</body>
</html>
