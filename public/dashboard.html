<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Desert Hot Tubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/util.js"></script>
<style>
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px;text-align:center;text-decoration:none;color:var(--text);transition:box-shadow .15s,border-color .15s;cursor:default}
.dash-card:hover{box-shadow:var(--shadow-md);border-color:var(--accent-light)}
.dash-card i{font-size:0;line-height:0;display:inline-block;width:26px;height:26px;margin-bottom:10px;background-color:var(--secondary);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.dash-card i::before{content:none !important}
.dash-card .dc-num{font-family:var(--font-display);font-size:28px;font-weight:600}
.dash-card .dc-label{font-size:12px;color:var(--text-muted);margin-top:4px}
.dash-card.c-total{background:radial-gradient(120% 140% at 0% 0%,var(--secondary) 0%,var(--accent) 62%,var(--accent-dark) 100%);border-color:transparent;box-shadow:var(--shadow-md)}
.dash-card.c-total i{background-color:#fbf3e8 !important}
.dash-card.c-total .dc-num{color:#fbf3e8 !important}
.dash-card.c-total .dc-label{color:rgba(251,243,232,.8)}
.dash-card.c-scheduled .dc-num{color:#553c9a}
.dash-card.c-tbo .dc-num{color:var(--yellow)}
.dash-card.c-pending .dc-num{color:var(--red)}

/* New widgets: Recent Contracts / Deliveries by Showroom / Needs Attention */
.board-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;margin-bottom:16px}
.board-grid>*{min-width:0}
@media(max-width:980px){.board-grid{grid-template-columns:1fr}}
/* Sales-role view: Showroom/Salesman stats removed (cross-salesperson data
   they can't see accurately anyway, since /api/contracts is scoped to their
   own contracts) and Recent Contracts goes full width. */
#dashBoardGrid.sales-view{grid-template-columns:1fr}
.side-stack{display:flex;flex-direction:column;gap:16px}
.table-scroll{overflow-x:auto;max-width:100%}
.cust-table{width:100%;border-collapse:collapse}
@media(max-width:600px){.cust-table{min-width:520px}}
.cust-table th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--border)}
.cust-table td{padding:10px 6px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.cust-table tr:last-child td{border-bottom:none}
.cust-table tr:hover td{background:var(--surface2)}
.cust-table .cust-name{font-weight:600;color:var(--text)}
.cust-table .cust-sub{display:block;font-weight:400;color:var(--text-light);font-size:11px;margin-top:2px}
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-radius:8px}
.mini-row:hover{background:var(--surface2)}
.mini-row .mr-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mini-row .mr-txt{font-size:13px;font-weight:600;color:var(--text)}
.mini-row .mr-sub{font-size:11.5px;color:var(--text-muted)}
.mini-row.link{cursor:pointer;text-decoration:none;color:inherit}
.loc-row{display:flex;align-items:center;gap:10px;padding:7px 4px}
.loc-row .lr-name{font-size:12.5px;font-weight:600;width:66px;flex-shrink:0;color:var(--text)}
.loc-row .lr-bar{flex:1;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.loc-row .lr-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--secondary),var(--accent));border-radius:4px}
.loc-row .lr-num{font-size:12.5px;font-weight:700;color:var(--text);width:22px;text-align:right}
#salesmanBody .lr-name{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-hint{font-size:12.5px;color:var(--text-light);padding:10px 4px}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.qa-btn{display:flex;align-items:center;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:box-shadow .15s;font-size:14px;font-weight:500}
.qa-btn:hover{box-shadow:var(--shadow-md)}
.qa-btn i{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--accent-bg);color:var(--accent)}

/* Notification bar */
.notif-bar{margin-bottom:20px}
.notif-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:8px;border:1px solid transparent}
.notif-card.green{background:var(--green-bg);border-color:var(--green-light)}
.notif-card.red{background:var(--red-bg);border-color:var(--red-light)}
.notif-msg{flex:1;min-width:0;overflow-wrap:break-word;word-break:break-word;font-size:13px;line-height:1.4}
.notif-msg a{color:var(--accent);font-weight:600;text-decoration:none}
.notif-msg a:hover{text-decoration:underline}
.notif-dismiss{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:20px;padding:0 4px;line-height:1;flex-shrink:0}
.notif-icon{font-size:16px;flex-shrink:0}
.notif-card.green .notif-icon{color:var(--green)}
.notif-card.red .notif-icon{color:var(--red)}

.notif-bar{margin-top:auto;padding-top:24px;margin-bottom:0;display:flex;flex-direction:column-reverse;gap:8px}
.notif-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;border:1px solid transparent;animation:nfSlide .2s ease}
.notif-card.green{background:var(--green-bg);border-color:var(--green-light)}
.notif-card.red{background:var(--red-bg);border-color:var(--red-light)}
.notif-msg{flex:1;min-width:0;overflow-wrap:break-word;word-break:break-word;font-size:13px;line-height:1.4}
.notif-msg a{color:var(--accent);font-weight:600;text-decoration:none}
.notif-dismiss{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:22px;padding:0 4px;line-height:1;flex-shrink:0}
.notif-icon{font-size:15px;flex-shrink:0}
.notif-card.green .notif-icon{color:var(--green)}
.notif-card.red .notif-icon{color:var(--red)}
@keyframes nfSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* Payment bell (admin) */
.ph-right{display:flex;align-items:center;gap:14px}
.bell-wrap{position:relative}
.bell-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:17px}
.bell-btn:hover{border-color:var(--accent-light)}
.bell-count{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.bell-count.wait{background:#d97706}
.bell-drop{position:absolute;top:48px;right:0;width:min(400px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60}
.bell-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;position:sticky;top:0;background:var(--surface)}
.bell-clear{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;font-family:inherit}
.bell-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.4;align-items:flex-start}
.bell-item:last-child{border-bottom:none}
.bell-item.wait{background:var(--yellow-bg)}
.bell-item .bi-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.bell-item .bi-body{flex:1;min-width:0;overflow-wrap:anywhere}
.bell-item .bi-body a{color:var(--accent);font-weight:600;text-decoration:none}
.bell-item small{display:block;color:var(--text-muted);font-size:11px;margin-top:2px}
.bell-item .bi-x{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
.bell-item .bi-thumb{width:46px;height:46px;border-radius:6px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.bi-acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.bi-reject{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.bi-reject input{flex:1;min-width:140px;font-size:12px;padding:5px 8px}
.bell-empty{padding:16px 14px;color:var(--text-muted);font-size:13px}
</style>
</head>
<body>
<div id="sidebar-root"></div>
<script src="/js/sidebar.js"></script>
<main class="main">
  <div class="page-header">
    <h1>Dashboard</h1>
    <div class="ph-right">
      <span style="font-size:13px;color:var(--text-muted)" id="dateStr"></span>
      <!-- Payment notifications + cash awaiting approval (admin, Nov 2026) -->
      <div class="bell-wrap" id="bellWrap" style="display:none">
        <button type="button" class="bell-btn" id="bellBtn" aria-label="Payment notifications" aria-expanded="false" onclick="toggleBell(event)">
          <i class="fa-regular fa-bell"></i><span class="bell-count" id="bellCount" style="display:none"></span>
        </button>
        <div class="bell-drop" id="bellDrop" style="display:none">
          <div class="bell-head"><span>Payments</span><button type="button" class="bell-clear" onclick="clearBell()">Clear all</button></div>
          <div id="bellList"><div class="bell-empty">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="dash-grid" id="dashGrid">
    <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted)"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>
  </div>
  <div style="margin-bottom:14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">Quick Actions</div>
  <div class="quick-actions">
    <a href="/contracts/new" class="qa-btn"><i class="fa-solid fa-plus"></i><span>New Contract</span></a>
    <a href="/contracts" class="qa-btn"><i class="fa-solid fa-list"></i><span>View Contracts</span></a>
    <a href="/status?tab=assigned" class="qa-btn"><i class="fa-solid fa-chart-gantt" style="background:#e9d8fd;color:#553c9a"></i><span>Status Board</span></a>
    <a href="/settings" class="qa-btn"><i class="fa-solid fa-gear" style="background:var(--surface2);color:var(--text-muted)"></i><span>Settings</span></a>
  </div>
  <div class="board-grid" id="dashBoardGrid" style="display:none">
    <div class="card" style="margin-bottom:0">
      <div class="card-header"><i class="fa-solid fa-clock-rotate-left"></i> Recent Contracts</div>
      <div id="recentContractsBody" class="table-scroll"><div class="empty-hint">Loading…</div></div>
    </div>
    <div class="side-stack">
      <div class="card" style="margin-bottom:0" id="showroomCard">
        <div class="card-header"><i class="fa-solid fa-store"></i> Deliveries by Showroom</div>
        <div class="mini-list" id="showroomBody"><div class="empty-hint">Loading…</div></div>
      </div>
      <div class="card" style="margin-bottom:0" id="salesmanCard">
        <div class="card-header"><i class="fa-solid fa-user-tie"></i> Contracts by Salesman</div>
        <div class="mini-list" id="salesmanBody"><div class="empty-hint">Loading…</div></div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="card-header"><i class="fa-solid fa-triangle-exclamation"></i> Needs Attention</div>
        <div class="mini-list" id="attentionBody"><div class="empty-hint">Nothing needs attention right now.</div></div>
      </div>
    </div>
  </div>
  <div class="notif-bar" id="notifBar"></div>
</main>
<script>
// Toast
function showToast(msg,type='success'){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);
}

// ── Notifications (rolling window of latest schedule/delivery/payment/new-contract events) ──
async function loadNotifications(){
  const bar = document.getElementById('notifBar');
  if(!bar) return;
  try{
    loadBell();
    const r = await fetch('/api/notifications');
    if(!r.ok){ bar.innerHTML=''; return; }
    const items = await r.json();
    if(!Array.isArray(items) || !items.length){ bar.innerHTML=''; return; }
    bar.innerHTML = items.map(function(n){
      const color = n.color==='red' ? 'red' : 'green';
      const icon  = color==='red' ? 'fa-triangle-exclamation' : 'fa-circle-check';
      const msg   = n.message || '';
      const idx   = msg.indexOf(' — ');
      const bodyHtml = (idx>0 && n.contract_id)
        ? '<a href="/contracts/'+n.contract_id+'">'+escHtml(msg.slice(0,idx))+'</a>'+escHtml(msg.slice(idx))
        : escHtml(msg);
      return '<div class="notif-card '+color+'" data-id="'+n.id+'">'
        +'<i class="fa-solid '+icon+' notif-icon"></i>'
        +'<div class="notif-msg">'+bodyHtml+'</div>'
        +'<button class="notif-dismiss" onclick="dismissNotif('+n.id+')" title="Dismiss">&times;</button>'
        +'</div>';
    }).join('');
  }catch(e){ bar.innerHTML=''; }
}
async function dismissNotif(id){
  const card = document.querySelector('.notif-card[data-id="'+id+'"]');
  if(card) card.remove();
  try{ await fetch('/api/notifications/'+id+'/dismiss',{method:'POST'}); }catch(e){}
  loadBell();
}

// ── Payment bell (admin): cash awaiting approval first (Approve / Reject here,
// no ×), then payment notifications (× each, Clear all). ──
let bellData = { pending: [], items: [] };
const money2 = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
async function loadBell(){
  const wrap = document.getElementById('bellWrap');
  if (window._userRole !== 'admin') { wrap.style.display='none'; return; }
  wrap.style.display='';
  try {
    const r = await fetch('/api/notifications/payments');
    if (!r.ok) return;
    bellData = await r.json();
  } catch(e) { return; }
  renderBell();
}
function renderBell(){
  const n = bellData.pending.length + bellData.items.length;
  const cnt = document.getElementById('bellCount');
  cnt.textContent = n; cnt.style.display = n ? '' : 'none';
  cnt.classList.toggle('wait', bellData.pending.length > 0);
  document.getElementById('bellBtn').setAttribute('aria-label', 'Payment notifications' + (bellData.pending.length ? ' — ' + bellData.pending.length + ' cash awaiting approval' : ''));
  const link = (id, num) => '<a href="/contracts/'+id+'">'+escHtml(num)+'</a>';
  const html = bellData.pending.map(p =>
      '<div class="bell-item wait" data-pid="'+p.id+'">'
      + (p.photo_url ? '<a href="'+escHtml(p.photo_url)+'" target="_blank" rel="noopener" title="Photo of the cash"><img class="bi-thumb" src="'+escHtml(p.photo_url)+'" alt="Cash photo"></a>' : '<span class="bi-dot" style="background:#d97706"></span>')
      + '<div class="bi-body">'+link(p.contract_id, p.contract_number)+' — Cash <b>'+money2(p.amount)+'</b> from '+escHtml(p.recorded_by_name||p.recorded_by||'')+' awaiting approval'
      + '<small>'+escHtml(p.customer_name||'')+' · taken '+escHtml(p.date ? new Date(p.date+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric'}) : '')+(p.notes ? ' · '+escHtml(p.notes) : '')+(p.photo_url ? '' : ' · no photo')+'</small>'
      + '<div class="bi-acts"><button type="button" class="btn btn-success btn-sm" onclick="approveCash('+p.id+',this)"><i class="fa-solid fa-check"></i> Approve</button>'
      + '<button type="button" class="btn btn-danger btn-sm" onclick="showReject('+p.id+')"><i class="fa-solid fa-xmark"></i> Reject</button></div>'
      + '<div class="bi-reject" id="rej-'+p.id+'" style="display:none"><input type="text" id="rejReason-'+p.id+'" placeholder="Reason (the salesperson sees it)" maxlength="200">'
      + '<button type="button" class="btn btn-danger btn-sm" onclick="rejectCash('+p.id+',this)">Reject</button></div>'
      + '</div></div>').join('')
    + bellData.items.map(it => {
      const msg = it.message || '', i = msg.indexOf(' — ');
      const body = (i>0 && it.contract_id) ? link(it.contract_id, msg.slice(0,i)) + escHtml(msg.slice(i)) : escHtml(msg);
      return '<div class="bell-item"><span class="bi-dot" style="background:'+(it.color==='red'?'var(--red)':'var(--green)')+'"></span>'
        + '<div class="bi-body">'+body+'<small>'+escHtml(azDateTime(it.created_at))+'</small></div>'
        + '<button type="button" class="bi-x" title="Dismiss" onclick="dismissBell('+it.id+')">&times;</button></div>';
    }).join('');
  document.getElementById('bellList').innerHTML = html || '<div class="bell-empty">No payment notifications.</div>';
}
function toggleBell(e){
  e.stopPropagation();
  const d = document.getElementById('bellDrop'), open = d.style.display === 'none';
  d.style.display = open ? '' : 'none';
  document.getElementById('bellBtn').setAttribute('aria-expanded', String(open));
  if (open) loadBell();
}
document.addEventListener('click', e => {
  if (!e.target.closest('#bellWrap')) { const d = document.getElementById('bellDrop'); if (d) d.style.display = 'none'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const d = document.getElementById('bellDrop'); if (d) d.style.display = 'none'; } });
async function dismissBell(id){
  bellData.items = bellData.items.filter(x => x.id !== id); renderBell();
  try { await fetch('/api/notifications/'+id+'/dismiss',{method:'POST'}); } catch(e){}
}
async function clearBell(){
  bellData.items = []; renderBell();
  try { await fetch('/api/notifications/payments/clear',{method:'POST'}); } catch(e){}
}
function showReject(id){
  const el = document.getElementById('rej-'+id); el.style.display = 'flex';
  document.getElementById('rejReason-'+id).focus();
}
async function decideCash(id, approve, btn, reason){
  btn.disabled = true;
  try {
    const r = await fetch('/api/payments/'+id+'/'+(approve?'approve':'reject'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(approve ? {} : {reason})});
    const j = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(j.error || 'Failed');
    showToast(approve ? 'Cash approved — the salesperson has been emailed' : 'Cash rejected — the salesperson has been emailed', 'success');
    loadBell();
  } catch(e) { showToast(e.message, 'error'); btn.disabled = false; }
}
function approveCash(id, btn){ decideCash(id, true, btn); }
function rejectCash(id, btn){
  const reason = document.getElementById('rejReason-'+id).value.trim();
  if (!reason) { showToast('Enter a reason for rejecting', 'error'); document.getElementById('rejReason-'+id).focus(); return; }
  decideCash(id, false, btn, reason);
}

// Close action dropdowns on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.action-menu')){
    document.querySelectorAll('.action-dropdown.open').forEach(d=>d.classList.remove('open'));
  }
});

function toggleActionMenu(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  document.querySelectorAll('.action-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  dd.classList.toggle('open');
}
</script>
<script>
document.getElementById('dateStr').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
async function loadDash() {
  // Sales role: /api/contracts is scoped to their own contracts, so the
  // Showroom/Salesman stats would show everyone else as a misleading zero
  // rather than the real team-wide numbers — dropped entirely for this role
  // rather than shown half-accurate. Recent Contracts takes the full row.
  const isSales = window._userRole === 'sales';

  const [contracts, salespeople] = await Promise.all([
    fetch('/api/contracts').then(r=>r.json()).catch(()=>[]),
    isSales ? Promise.resolve([]) : fetch('/api/sales/active/list').then(r=>r.json()).catch(()=>[]),
  ]);
  const pending = contracts.filter(c=>c.status!=="cancelled"&&parseFloat(c.due_prior||0)>0).length;
  const scheduled = contracts.filter(c=>c.status==='scheduled').length;
  const tbo = contracts.filter(c=>c.status==='tbo').length;
  document.getElementById('dashGrid').innerHTML =
    '<div class="dash-card c-total"><i class="fa-solid fa-file-contract"></i><div class="dc-num">' + contracts.length + '</div><div class="dc-label">Total Contracts</div></div>' +
    '<div class="dash-card c-scheduled"><i class="fa-solid fa-calendar-check"></i><div class="dc-num" style="color:#553c9a">' + scheduled + '</div><div class="dc-label">Scheduled</div></div>' +
    '<div class="dash-card c-tbo"><i class="fa-solid fa-box"></i><div class="dc-num" style="color:var(--yellow)">' + tbo + '</div><div class="dc-label">To Be Ordered</div></div>' +
    '<div class="dash-card c-pending"><i class="fa-solid fa-triangle-exclamation"></i><div class="dc-num" style="color:var(--red)">' + pending + '</div><div class="dc-label">Payment Pending</div></div>';

  renderRecentContracts(contracts);
  document.getElementById('dashBoardGrid').classList.toggle('sales-view', isSales);
  document.getElementById('showroomCard').style.display = isSales ? 'none' : '';
  document.getElementById('salesmanCard').style.display = isSales ? 'none' : '';
  if (!isSales) {
    renderShowroomBreakdown(contracts);
    renderSalesmanBreakdown(contracts, salespeople);
  }
  renderNeedsAttention(contracts);
  document.getElementById('dashBoardGrid').style.display = '';
}

const STATUS_BADGE = {assigned:'badge-assigned',tbo:'badge-tbo',received:'badge-assigned',scheduled:'badge-scheduled',delivered:'badge-delivered',cancelled:'badge-cancelled'};
const STATUS_LABEL = {assigned:'Assigned',tbo:'To Be Ordered',received:'Received',scheduled:'Scheduled',delivered:'Delivered',cancelled:'Cancelled'};

function renderRecentContracts(contracts) {
  const el = document.getElementById('recentContractsBody');
  // Old sales entered after delivery would push today's contracts off the list.
  const recent = contracts.filter(c => !c.back_entered).slice(0, 5);
  if (!recent.length) { el.innerHTML = '<div class="empty-hint">No contracts yet.</div>'; return; }
  el.innerHTML = '<table class="cust-table"><thead><tr><th>Contract #</th><th>Customer</th><th>Spa</th><th>Salesman</th><th>Status</th></tr></thead><tbody>' +
    recent.map(c => {
      const spa = [c.make, c.model].filter(Boolean).join(' ') || '—';
      const badge = STATUS_BADGE[c.status] || 'badge-assigned';
      const label = STATUS_LABEL[c.status] || c.status;
      return '<tr onclick="location.href=\'/contracts/'+c.id+'\'" style="cursor:pointer">' +
        '<td>' + escHtml(c.contract_number||'—') + '</td>' +
        '<td><span class="cust-name">' + escHtml(c.customer_name||'Unknown') + '</span><span class="cust-sub">' + escHtml(c.store||'') + '</span></td>' +
        '<td>' + escHtml(spa) + '</td>' +
        '<td>' + escHtml(c.salesman||'—') + '</td>' +
        '<td><span class="badge ' + badge + '">' + label + '</span></td>' +
        '</tr>';
    }).join('') + '</tbody></table>';
}

function renderShowroomBreakdown(contracts) {
  const el = document.getElementById('showroomBody');
  const stores = ['Phoenix','Goodyear','Chandler','Surprise','Tolleson'];
  const counts = {}; stores.forEach(s => counts[s] = 0);
  contracts.forEach(c => { if (counts.hasOwnProperty(c.store)) counts[c.store]++; });
  const max = Math.max(1, ...stores.map(s => counts[s]));
  el.innerHTML = stores.map(s =>
    '<div class="loc-row"><span class="lr-name">' + s + '</span>' +
    '<span class="lr-bar"><span style="width:' + Math.round(counts[s]/max*100) + '%"></span></span>' +
    '<span class="lr-num">' + counts[s] + '</span></div>'
  ).join('');
}

function renderSalesmanBreakdown(contracts, salespeople) {
  const el = document.getElementById('salesmanBody');
  if (!salespeople.length) { el.innerHTML = '<div class="empty-hint">No active salespeople.</div>'; return; }
  // Counting by salesman_user_id (not the free-text salesman name) and only
  // against the active-salespeople list means: a deactivated salesperson
  // gets no row at all, and a deleted contract is simply absent from the
  // next /api/contracts fetch — both handled by this being a fresh count
  // on every load rather than a stored/cached number.
  const counts = {}; salespeople.forEach(s => counts[s.id] = 0);
  contracts.forEach(c => { if (c.salesman_user_id && counts.hasOwnProperty(c.salesman_user_id)) counts[c.salesman_user_id]++; });
  const sorted = [...salespeople].sort((a,b) => counts[b.id]-counts[a.id] || a.name.localeCompare(b.name));
  const max = Math.max(1, ...sorted.map(s => counts[s.id]));
  el.innerHTML = sorted.map(s =>
    '<div class="loc-row"><span class="lr-name" title="' + escHtml(s.name) + '">' + escHtml(s.name) + '</span>' +
    '<span class="lr-bar"><span style="width:' + Math.round(counts[s.id]/max*100) + '%"></span></span>' +
    '<span class="lr-num">' + counts[s.id] + '</span></div>'
  ).join('');
}

function renderNeedsAttention(contracts) {
  const el = document.getElementById('attentionBody');
  const paymentPending = contracts.filter(c => c.status!=='cancelled' && parseFloat(c.due_prior||0)>0).length;
  const tboCount = contracts.filter(c => c.status==='tbo').length;
  const missingSerial = contracts.filter(c => (c.status==='scheduled'||c.status==='received') && !c.serial_number).length;

  const items = [];
  if (paymentPending) items.push({href:'/status?tab=assigned', icon:'fa-dollar-sign', bg:'var(--red-bg)', fg:'var(--red)', txt: paymentPending + ' contract' + (paymentPending===1?'':'s') + ' awaiting payment', sub:'Blocks delivery scheduling'});
  if (tboCount) items.push({href:'/status?tab=tbo', icon:'fa-box', bg:'var(--yellow-bg)', fg:'var(--yellow)', txt: tboCount + ' spa' + (tboCount===1?'':'s') + ' to be ordered', sub:'Factory order not yet placed'});
  if (missingSerial) items.push({href:'/status?tab=scheduled', icon:'fa-barcode', bg:'var(--accent-bg)', fg:'var(--accent)', txt: missingSerial + ' serial number' + (missingSerial===1?'':'s') + ' unassigned', sub:'Needed before delivery'});

  el.innerHTML = items.length ? items.map(it =>
    '<a class="mini-row link" href="' + it.href + '">' +
    '<div class="mr-ic" style="background:' + it.bg + ';color:' + it.fg + '"><i class="fa-solid ' + it.icon + '"></i></div>' +
    '<div><div class="mr-txt">' + it.txt + '</div><div class="mr-sub">' + it.sub + '</div></div>' +
    '</a>'
  ).join('') : '<div class="empty-hint">Nothing needs attention right now.</div>';
}

// Deferred until sidebar.js's auth check sets window._userRole, so the
// sales-view branch above is never computed before the role is known
// (same convention as view-contracts.html / status.html / inventory-list.html).
window._onAuthReady = loadDash;
</script>
