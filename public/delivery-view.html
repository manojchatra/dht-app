<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery — Desert Hot Tubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/util.js"></script>
<style>
.dv-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.dv-label{font-size:11px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.dv-value{font-size:14px;font-weight:500;margin-bottom:10px}
.dv-large{font-size:18px;font-weight:700;color:var(--accent)}
.dv-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);color:var(--accent);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;margin-bottom:12px}
.slot-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:12px;font-size:13px}
.ack-btn{width:100%;padding:14px;font-size:15px;font-weight:600;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--font);margin-top:8px}
.ack-btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<button class="hamburger" onclick="openMobileSidebar()"><i class="fa-solid fa-bars"></i> Menu</button>
<a class="mobile-home-btn" href="/dashboard" aria-label="Home"><i class="fa-solid fa-house"></i></a>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header"><a href="/dashboard" class="brand-mark"><span class="brand-glyph">DHT</span><span class="brand-text"><span class="brand-name">Desert Hot Tubs</span><span class="brand-sub">Sales &amp; Delivery</span></span></a></div>
  <div>
    <button class="nav-item " id="nav-contracts" onclick="toggleNav('contracts')">
      <i class="fa-solid fa-file-contract"></i>Contracts<i class="fa-solid fa-chevron-right nav-arrow"></i>
    </button>
    <div class="nav-sub " id="sub-contracts">
      <a class="nav-sub-item " href="/contracts/new"><i class="fa-solid fa-plus"></i> New Contract</a>
      <a class="nav-sub-item " href="/contracts"><i class="fa-solid fa-list"></i> View Contracts</a>
    </div>
  </div>
  <div>
    <button class="nav-item " id="nav-status" onclick="toggleNav('status')">
      <i class="fa-solid fa-chart-gantt"></i>Status<i class="fa-solid fa-chevron-right nav-arrow"></i>
    </button>
    <div class="nav-sub " id="sub-status">
      <a class="nav-sub-item " href="/status?tab=assigned"><i class="fa-solid fa-circle-check"></i> Assigned</a>
      <a class="nav-sub-item " href="/status?tab=tbo"><i class="fa-solid fa-box"></i> To Be Ordered</a>
      <a class="nav-sub-item " href="/status?tab=received"><i class="fa-solid fa-truck-arrow-right"></i> Received</a>
      <a class="nav-sub-item " href="/status?tab=scheduled"><i class="fa-solid fa-calendar-check"></i> Scheduled</a>
      <a class="nav-sub-item " href="/status?tab=delivered"><i class="fa-solid fa-truck-ramp-box"></i> Delivered</a>
      <a class="nav-sub-item " href="/status?tab=cancelled"><i class="fa-solid fa-ban"></i> Cancelled</a>
    </div>
  </div>
  <a class="nav-item " href="/calendar"><i class="fa-solid fa-calendar"></i>Calendar</a>
  <a class="nav-item active" href="/acknowledgement"><i class="fa-solid fa-clipboard-check"></i>Acknowledgement</a>
  <a class="nav-item " href="/post-delivery"><i class="fa-solid fa-phone"></i>Post-Delivery Follow-up</a>
  <hr class="nav-divider">
  <div class="sidebar-bottom">
    <a class="nav-item " href="/settings"><i class="fa-solid fa-gear"></i>Settings</a>
    <button class="nav-item" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i>Sign Out</button>
    <div class="user-chip">
      <div class="user-avatar" id="userAvatar">?</div>
      <div><div class="user-name" id="userName">...</div><div class="user-role" id="userRole"></div></div>
    </div>
  </div>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>
<main class="main" id="dvMain">
<a id="dvBackLink" href="/calendar" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);text-decoration:none;padding:16px 20px;margin-bottom:0"><i class="fa-solid fa-arrow-left"></i> <span id="dvBackLabel">Back to Calendar</span></a>
<div style="max-width:640px;margin:0 auto;padding:0 16px 40px">
  <div id="loadingMsg" style="text-align:center;padding:60px;color:var(--text-muted)"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
  <div id="content" style="display:none"></div>
</div>
</main>
<script>
// Auth
fetch('/auth/me').then(r=>r.json()).then(u=>{
  if(!u.username){window.location.href='/login';return}
  var _un=document.getElementById('userName');if(_un)_un.textContent=u.username;
  var _ur=document.getElementById('userRole');if(_ur)_ur.textContent=u.role==='admin'?'Administrator':'Sales';
  var _ua=document.getElementById('userAvatar');if(_ua)_ua.textContent=u.username[0].toUpperCase();
  window._userRole=u.role;
  window._userTeam=u.team||null;
  if(typeof window._onAuthReady==='function')window._onAuthReady();
  document.body.style.visibility='visible';
  if(u.role==='delivery'){
    document.querySelectorAll('.nav-item:not([href="/calendar"])').forEach(function(el){
      if(el.querySelector('.fa-right-from-bracket')) return; // keep sign out
      el.style.display='none';
    });
  }
  if(u.role==='admin') document.querySelectorAll('.admin-only').forEach(el=>{
    if(el.tagName==='BUTTON'||el.tagName==='A') el.style.display='flex';
    else el.style.display='';
  });
}).catch(()=>window.location.href='/login');

// Sidebar accordion — auto-open based on current URL
function initSidebar(){
  const p=window.location.pathname;
  const searchMap={
    '/contracts':'contracts',
    '/status':'status',
  };
  for(const [prefix,id] of Object.entries(searchMap)){
    if(p.startsWith(prefix)){
      const sub=document.getElementById('sub-'+id);
      const btn=document.getElementById('nav-'+id);
      if(sub&&!sub.classList.contains('open')){
        sub.classList.add('open');
        if(btn) btn.classList.add('nav-open');
      }
    }
  }
}

function toggleNav(id){
  const sub=document.getElementById('sub-'+id);
  const btn=document.getElementById('nav-'+id);
  const isOpen=sub.classList.toggle('open');
  btn.classList.toggle('nav-open',isOpen);
}

// Mobile sidebar
function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('mobile-open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('mobile-open');
}

// Sign out
async function signOut(){
  await fetch('/auth/logout',{method:'POST'});
  window.location.href='/login';
}

// Toast
function showToast(msg,type='success'){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500);
}

// Close action dropdowns on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.action-menu')){
    document.querySelectorAll('.action-dropdown.open').forEach(d=>d.classList.remove('open'));
  }
});

function toggleActionMenu(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  document.querySelectorAll('.action-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  dd.classList.toggle('open');
}

initSidebar();
</script>
<script>
const contractId = window.location.pathname.split('/').pop();

function fmtSlot(dt, dur) {
  if (!dt) return 'Not scheduled';
  const d = new Date(dt);
  const end = new Date(d.getTime() + (dur||120)*60000);
  return d.toLocaleDateString('en-US',{timeZone:'America/Phoenix',weekday:'long',month:'long',day:'numeric',year:'numeric'})
    + ' · ' + d.toLocaleTimeString('en-US',{timeZone:'America/Phoenix',hour:'2-digit',minute:'2-digit'})
    + ' – ' + end.toLocaleTimeString('en-US',{timeZone:'America/Phoenix',hour:'2-digit',minute:'2-digit'});
}

async function loadDelivery() {
  const r = await fetch('/api/delivery/contract/' + contractId);
  if (!r.ok) { document.getElementById('loadingMsg').textContent = 'Unable to load delivery. Contact your dispatcher.'; return; }
  const c = await r.json();
  document.getElementById('loadingMsg').style.display = 'none';

  const hasAck = c.has_acknowledgement;
  const html = '<div class="dv-badge"><i class="fa-solid fa-truck-arrow-right"></i>Delivery Assignment</div>'
    + '<h2 style="font-size:20px;font-weight:700;margin:0 0 4px">' + escHtml(c.customer_name||'—') + '</h2>'
    + '<div style="font-size:13px;color:var(--text-muted);margin-bottom:16px">' + escHtml(c.contract_number) + '</div>'

    + '<div class="dv-card">'
    + '<div class="dv-label">Delivery Slot</div>'
    + '<div class="slot-box" style="color:var(--accent);font-weight:600"><i class="fa-solid fa-calendar-check"></i> ' + fmtSlot(c.scheduled_datetime, c.scheduled_duration) + '</div>'
    + '</div>'

    + '<div class="dv-card">'
    + '<div class="dv-label">Customer</div>'
    + '<div class="dv-value">' + escHtml(c.address||'—') + (c.zip?' '+escHtml(c.zip):'') + '</div>'
    + (c.phone ? '<div class="dv-value"><a href="tel:' + encodeURIComponent(c.phone) + '" style="color:var(--accent)"><i class="fa-solid fa-phone"></i> ' + escHtml(c.phone) + '</a></div>' : '')
    + (c.gated ? '<div style="background:#fef3c7;border:1px solid #fde047;border-radius:6px;padding:8px 12px;font-size:13px;margin-top:6px"><i class="fa-solid fa-lock" style="color:#b45309"></i> <strong>Gated Community</strong>' + (c.gate_code?' — Code: <strong>'+escHtml(c.gate_code)+'</strong>':'') + '</div>' : '')
    + '</div>'

    + '<div class="dv-card">'
    + '<div class="dv-label">Hot Tub</div>'
    + '<div class="dv-large">' + escHtml(c.make||'') + ' ' + escHtml(c.model||'') + '</div>'
    + (c.year ? '<div class="dv-value" style="color:var(--text-muted)">' + escHtml(c.year) + '</div>' : '')
    + '<div class="dv-value">S/N: <strong>' + escHtml(c.serial_number||'—') + '</strong></div>'
    + '<div class="dv-value">Shell: ' + escHtml(c.shell_color||'—') + ' · Cabinet: ' + escHtml(c.cabinet_color||'—') + '</div>'
    + (c.cover_color ? '<div class="dv-value">Cover: ' + escHtml(c.cover_color) + '</div>' : '')
    + '</div>'

    + '<div class="dv-card">'
    + '<div class="dv-label">Options Selected</div>'
    + (c.water_care_system ? '<div class="dv-value">Water Care: <strong>' + escHtml(c.water_care_system) + '</strong>' + (c.upgraded_water_care?' + '+escHtml(c.upgraded_water_care):'') + '</div>' : '')
    + (c.steps_type ? '<div class="dv-value">Steps: <strong>' + escHtml(c.steps_type) + '</strong></div>' : '')
    + (c.cover_type ? '<div class="dv-value">Cover: <strong>' + escHtml(c.cover_type) + '</strong></div>' : '')
    + (c.in_town_delivery ? '<div class="dv-value"><i class="fa-solid fa-truck" style="color:var(--green)"></i> In-Town Delivery</div>' : '')
    + (c.crane ? '<div class="dv-value"><i class="fa-solid fa-crane" style="color:var(--accent)"></i> Crane Required</div>' : '')
    + '</div>'

    + (hasAck
      ? '<div style="background:var(--green-bg,#f0fdf4);border:1px solid #86efac;border-radius:8px;padding:12px 16px;text-align:center;color:var(--green);font-weight:600"><i class="fa-solid fa-circle-check"></i> Acknowledgement already completed</div>'
      : '<button class="ack-btn" onclick="window.location.href=\'/acknowledgement/' + c.id + '\'"><i class="fa-solid fa-clipboard-check"></i> Start Delivery Acknowledgement</button>'
    );

  document.getElementById('content').innerHTML = html;
  document.getElementById('content').style.display = 'block';
}

// Wait for auth before setting role-specific UI and loading data
window._onAuthReady = function() {
  var sb  = document.getElementById('sidebar');
  var sob = document.getElementById('sidebarOverlay');
  if (window._userRole === 'admin' || window._userRole === 'sales') {
    // Show sidebar for admin/sales
    if (sb) sb.style.visibility = 'visible';
    var bl  = document.getElementById('dvBackLink');
    var blt = document.getElementById('dvBackLabel');
    if (bl)  bl.href = '/acknowledgement';
    if (blt) blt.textContent = 'Back to Acknowledgement';
  } else if (window._userRole === 'delivery') {
    // Hide sidebar for delivery team
    if (sb)  sb.style.display = 'none';
    if (sob) sob.style.display = 'none';
    var hm = document.querySelector('.hamburger');
    if (hm)  hm.style.display = 'none';
  }
  loadDelivery();
};
</script>
</body>
</html>
